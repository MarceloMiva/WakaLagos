<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Waka Lagos — Navigate the City</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --orange: #FF6B2B;
  --orange-light: #FF8C55;
  --orange-glow: rgba(255,107,43,0.2);
  --green: #00C851;
  --green-glow: rgba(0,200,81,0.15);
  --yellow: #FFD23F;
  --bg: #0A0A0F;
  --surface: #13131A;
  --surface2: #1C1C26;
  --border: rgba(255,255,255,0.07);
  --text: #E8E8F0;
  --muted: #6B6B80;
  --white: #FFFFFF;
  --danger: #FF4444;
  --blue: #4A9EFF;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  overflow: hidden;
  font-family: 'Space Grotesk', sans-serif;
  background: var(--bg);
  color: var(--text);
}

/* ── SPLASH SCREEN ── */
#splash {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
  transition: opacity 0.6s ease;
}

#splash.hide { opacity: 0; pointer-events: none; }

.splash-logo {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 48px;
  letter-spacing: -2px;
}

.splash-logo span { color: var(--orange); }

.splash-sub {
  font-size: 14px;
  color: var(--muted);
  letter-spacing: 3px;
  text-transform: uppercase;
}

.splash-loader {
  width: 200px;
  height: 3px;
  background: var(--surface2);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 16px;
}

.splash-loader-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--orange), var(--yellow));
  border-radius: 2px;
  animation: load 2s ease forwards;
}

@keyframes load {
  from { width: 0; }
  to { width: 100%; }
}

.splash-status {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  animation: pulse-text 1s infinite;
}

@keyframes pulse-text { 50% { opacity: 0.4; } }

/* ── LAYOUT ── */
#app {
  height: 100vh;
  display: flex;
  flex-direction: column;
  opacity: 0;
  transition: opacity 0.6s ease;
}

#app.visible { opacity: 1; }

/* ── TOPBAR ── */
#topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 100;
  flex-shrink: 0;
}

.app-logo {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 20px;
  letter-spacing: -0.5px;
  flex-shrink: 0;
}

.app-logo span { color: var(--orange); }

.search-wrap {
  flex: 1;
  position: relative;
}

#search-input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px 10px 38px;
  color: var(--text);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}

#search-input::placeholder { color: var(--muted); }
#search-input:focus { border-color: var(--orange); }

.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  font-size: 15px;
  pointer-events: none;
}

#locate-btn {
  width: 42px; height: 42px;
  background: var(--orange);
  border: none;
  border-radius: 10px;
  color: white;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.2s, transform 0.1s;
}

#locate-btn:hover { background: var(--orange-light); }
#locate-btn:active { transform: scale(0.95); }

/* ── MAP ── */
#map {
  flex: 1;
  position: relative;
  z-index: 1;
}

/* Leaflet override */
.leaflet-container { background: #1a1a2e; }
.leaflet-tile { filter: brightness(0.85) saturate(0.7); }

/* ── BOTTOM PANEL ── */
#bottom-panel {
  background: var(--surface);
  border-top: 1px solid var(--border);
  z-index: 100;
  flex-shrink: 0;
  max-height: 55vh;
  overflow-y: auto;
  transition: max-height 0.3s ease;
}

#bottom-panel.collapsed { max-height: 70px; overflow: hidden; }

.panel-handle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px 10px;
  cursor: pointer;
  position: sticky;
  top: 0;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  z-index: 1;
}

.panel-title {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 15px;
}

.panel-toggle {
  font-size: 18px;
  color: var(--muted);
  transition: transform 0.3s;
}

#bottom-panel.collapsed .panel-toggle { transform: rotate(180deg); }

/* ── TABS ── */
.tabs {
  display: flex;
  padding: 0 16px;
  gap: 4px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  position: sticky;
  top: 49px;
  z-index: 1;
}

.tab-btn {
  padding: 10px 14px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.5px;
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.2s, border-color 0.2s;
  text-transform: uppercase;
}

.tab-btn.active {
  color: var(--orange);
  border-bottom-color: var(--orange);
}

/* ── ROUTE PLANNER ── */
#tab-route {
  padding: 16px;
}

.input-row {
  display: flex;
  gap: 10px;
  margin-bottom: 12px;
  align-items: flex-start;
}

.dot-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 13px;
  gap: 3px;
}

.dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.dot.from { background: var(--green); box-shadow: 0 0 6px var(--green); }
.dot.to { background: var(--orange); box-shadow: 0 0 6px var(--orange); }
.dot-line { width: 2px; height: 20px; background: var(--border); }

.inputs-col { flex: 1; display: flex; flex-direction: column; gap: 8px; }

.route-input {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 11px 14px;
  color: var(--text);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 14px;
  outline: none;
  width: 100%;
  transition: border-color 0.2s;
}

.route-input:focus { border-color: var(--orange); }
.route-input::placeholder { color: var(--muted); }

#find-route-btn {
  width: 100%;
  background: var(--orange);
  border: none;
  border-radius: 12px;
  padding: 14px;
  color: white;
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
  letter-spacing: 0.5px;
}

#find-route-btn:hover { background: var(--orange-light); }
#find-route-btn:active { transform: scale(0.98); }

/* ── ROUTE RESULT ── */
#route-result {
  margin-top: 16px;
}

.route-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 12px;
}

.route-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.route-badge {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 20px;
}

.badge-brt { background: rgba(74,158,255,0.15); color: var(--blue); border: 1px solid rgba(74,158,255,0.3); }
.badge-danfo { background: rgba(255,210,63,0.15); color: var(--yellow); border: 1px solid rgba(255,210,63,0.3); }
.badge-keke { background: rgba(0,200,81,0.15); color: var(--green); border: 1px solid rgba(0,200,81,0.3); }
.badge-walk { background: rgba(255,255,255,0.08); color: var(--muted); border: 1px solid var(--border); }

.route-time {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--muted);
}

.route-steps { display: flex; flex-direction: column; gap: 10px; }

.step {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}

.step-icon {
  width: 32px; height: 32px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
  background: var(--surface);
}

.step-info { flex: 1; }

.step-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 2px;
}

.step-detail {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.4;
}

.step-dist {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--orange);
  flex-shrink: 0;
  padding-top: 2px;
}

.fare-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}

.fare-label { font-size: 12px; color: var(--muted); }
.fare-amount {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 16px;
  color: var(--green);
}

/* ── NEARBY ── */
#tab-nearby {
  padding: 16px;
}

.nearby-list { display: flex; flex-direction: column; gap: 10px; }

.nearby-item {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
}

.nearby-item:hover {
  border-color: var(--orange);
  background: rgba(255,107,43,0.05);
}

.nearby-icon {
  width: 40px; height: 40px;
  border-radius: 10px;
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}

.nearby-info { flex: 1; }
.nearby-name { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
.nearby-meta { font-size: 12px; color: var(--muted); }

.nearby-dist {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--orange);
  font-weight: 500;
}

/* ── INFO CARDS ── */
.info-card {
  background: var(--surface2);
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 13px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.info-card.success { border: 1px solid rgba(0,200,81,0.3); color: var(--green); }
.info-card.warning { border: 1px solid rgba(255,210,63,0.3); color: var(--yellow); }
.info-card.info { border: 1px solid rgba(74,158,255,0.3); color: var(--blue); }

/* ── MAP POPUP OVERRIDE ── */
.leaflet-popup-content-wrapper {
  background: var(--surface2) !important;
  color: var(--text) !important;
  border: 1px solid var(--border) !important;
  border-radius: 12px !important;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5) !important;
}

.leaflet-popup-tip { background: var(--surface2) !important; }

.popup-name {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 14px;
  margin-bottom: 6px;
}

.popup-meta { font-size: 12px; color: var(--muted); line-height: 1.6; }
.popup-routes { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }

.popup-route-tag {
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 20px;
  background: rgba(255,107,43,0.15);
  color: var(--orange);
  border: 1px solid rgba(255,107,43,0.3);
}

/* ── USER MARKER ── */
.user-dot {
  width: 16px; height: 16px;
  background: var(--blue);
  border: 3px solid white;
  border-radius: 50%;
  box-shadow: 0 0 0 6px rgba(74,158,255,0.25);
}

/* ── LOADING STATE ── */
.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px;
  gap: 10px;
  color: var(--muted);
  font-size: 13px;
}

.spinner {
  width: 18px; height: 18px;
  border: 2px solid var(--border);
  border-top-color: var(--orange);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ── AUTOCOMPLETE ── */
.autocomplete-list {
  position: absolute;
  top: 100%;
  left: 0; right: 0;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-top: 4px;
  z-index: 9999;
  max-height: 200px;
  overflow-y: auto;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}

.autocomplete-item {
  padding: 10px 14px;
  font-size: 13px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: background 0.15s;
  border-bottom: 1px solid var(--border);
}

.autocomplete-item:last-child { border-bottom: none; }
.autocomplete-item:hover { background: rgba(255,107,43,0.08); }
.autocomplete-item .ac-icon { color: var(--muted); font-size: 14px; }
.autocomplete-item .ac-name { color: var(--text); font-weight: 500; }
.autocomplete-item .ac-type { color: var(--muted); font-size: 11px; }

/* ── STATUS BAR ── */
#status-bar {
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  padding: 6px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  flex-shrink: 0;
  transition: background 0.3s;
}

#status-bar.tracking { background: rgba(0,200,81,0.08); color: var(--green); }
.status-dot-live {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--muted);
  flex-shrink: 0;
}

#status-bar.tracking .status-dot-live {
  background: var(--green);
  box-shadow: 0 0 6px var(--green);
  animation: pulse 2s infinite;
}

@keyframes pulse { 50% { opacity: 0.4; } }

/* ── NO RESULT ── */
.no-result {
  text-align: center;
  padding: 28px 16px;
  color: var(--muted);
}

.no-result .nr-icon { font-size: 36px; margin-bottom: 10px; }
.no-result .nr-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 16px; color: var(--text); margin-bottom: 6px; }
.no-result .nr-sub { font-size: 13px; line-height: 1.5; }

/* scrollbar */
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="splash-logo">Waka<span>Lagos</span></div>
  <div class="splash-sub">Navigate the City</div>
  <div class="splash-loader"><div class="splash-loader-bar"></div></div>
  <div class="splash-status" id="splash-status">Initializing GPS...</div>
</div>

<!-- APP -->
<div id="app">
  <div id="topbar">
    <div class="app-logo">Waka<span>Lagos</span></div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="Search bus stop or area..." autocomplete="off">
      <div class="autocomplete-list" id="search-autocomplete" style="display:none;"></div>
    </div>
    <button id="locate-btn" title="Find my location">📍</button>
  </div>

  <div id="status-bar">
    <div class="status-dot-live"></div>
    <span id="status-text">Tap 📍 to find your location</span>
  </div>

  <div id="map"></div>

  <div id="bottom-panel">
    <div class="panel-handle" id="panel-handle">
      <div class="panel-title" id="panel-title">Plan Your Route</div>
      <div class="panel-toggle">▲</div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="route">🗺️ Route</button>
      <button class="tab-btn" data-tab="nearby">📍 Nearby</button>
      <button class="tab-btn" data-tab="lines">🚌 Lines</button>
    </div>

    <!-- ROUTE TAB -->
    <div id="tab-route" class="tab-content">
      <div class="input-row">
        <div class="dot-col">
          <div class="dot from"></div>
          <div class="dot-line"></div>
          <div class="dot from" style="opacity:0.3"></div>
          <div class="dot-line"></div>
          <div class="dot to"></div>
        </div>
        <div class="inputs-col">
          <div style="position:relative;">
            <input type="text" class="route-input" id="from-input" placeholder="From (or use 📍 for current location)" autocomplete="off">
            <div class="autocomplete-list" id="from-autocomplete" style="display:none;"></div>
          </div>
          <div style="position:relative;">
            <input type="text" class="route-input" id="to-input" placeholder="To — destination" autocomplete="off">
            <div class="autocomplete-list" id="to-autocomplete" style="display:none;"></div>
          </div>
        </div>
      </div>
      <button id="find-route-btn">Find Route →</button>
      <div id="route-result"></div>
    </div>

    <!-- NEARBY TAB -->
    <div id="tab-nearby" class="tab-content" style="display:none;">
      <div class="info-card info">📍 <span id="nearby-status">Tap 📍 to find stops near you</span></div>
      <div class="nearby-list" id="nearby-list"></div>
    </div>

    <!-- LINES TAB -->
    <div id="tab-lines" class="tab-content" style="display:none; padding:16px;">
      <div id="lines-list"></div>
    </div>
  </div>
</div>

<script>

// APP STATE
// ═══════════════════════════════════════════════
let map, userMarker, userLat, userLng, watchId;
let stopMarkers = [];
let routeLines = [];
let selectedFrom = null, selectedTo = null;
const stopNames = Object.keys(STOPS);

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
function init() {
  // Map
  map = L.map('map', {
    center: [6.5244, 3.3792],
    zoom: 12,
    zoomControl: false,
    attributionControl: false
  });

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19
  }).addTo(map);

  L.control.zoom({ position: 'topright' }).addTo(map);

  // Plot all stops
  plotAllStops();

  // Render lines tab
  renderLinesTab();

  // Events
  document.getElementById('locate-btn').addEventListener('click', locateUser);
  document.getElementById('panel-handle').addEventListener('click', togglePanel);
  document.getElementById('find-route-btn').addEventListener('click', findRoute);

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  setupAutocomplete('search-input', 'search-autocomplete', (name) => {
    const s = STOPS[name];
    if (s) {
      map.setView([s.lat, s.lng], 16);
      showStopPopup(name, s);
    }
  });

  setupAutocomplete('from-input', 'from-autocomplete', (name) => {
    selectedFrom = name;
    document.getElementById('from-input').value = name;
  });

  setupAutocomplete('to-input', 'to-autocomplete', (name) => {
    selectedTo = name;
    document.getElementById('to-input').value = name;
  });
}

// ═══════════════════════════════════════════════
// PLOT STOPS
// ═══════════════════════════════════════════════
function plotAllStops() {
  stopNames.forEach(name => {
    const s = STOPS[name];
    const isBRT = s.routes.some(r => r.startsWith('BRT'));
    const isTerminal = s.type.includes('Terminal');

    const icon = L.divIcon({
      className: '',
      html: `<div style="
        width:${isTerminal ? 14 : 9}px;
        height:${isTerminal ? 14 : 9}px;
        background:${isBRT ? '#4A9EFF' : '#FFD23F'};
        border:2px solid ${isBRT ? 'rgba(74,158,255,0.5)' : 'rgba(255,210,63,0.5)'};
        border-radius:50%;
        box-shadow:0 0 ${isTerminal ? 8 : 4}px ${isBRT ? 'rgba(74,158,255,0.6)' : 'rgba(255,210,63,0.5)'};
      "></div>`,
      iconSize: [isTerminal ? 14 : 9, isTerminal ? 14 : 9],
      iconAnchor: [isTerminal ? 7 : 4, isTerminal ? 7 : 4]
    });

    const marker = L.marker([s.lat, s.lng], { icon })
      .addTo(map)
      .on('click', () => showStopPopup(name, s));

    stopMarkers.push(marker);
  });
}

function showStopPopup(name, s) {
  const routeHtml = s.routes.map(r => {
    const route = ROUTES[r];
    return route ? `<span class="popup-route-tag">${route.name}</span>` : '';
  }).join('');

  const extras = [];
  if (s.keke) extras.push('🛺 Keke available');
  if (s.bike) extras.push('🏍️ Bike available');

  L.popup({ maxWidth: 260 })
    .setLatLng([s.lat, s.lng])
    .setContent(`
      <div class="popup-name">${name}</div>
      <div class="popup-meta">
        ${s.type}<br>
        ${extras.join(' · ')}
      </div>
      <div class="popup-routes">${routeHtml}</div>
    `)
    .openOn(map);
}

// ═══════════════════════════════════════════════
// LOCATE USER
// ═══════════════════════════════════════════════
function locateUser() {
  if (!navigator.geolocation) {
    setStatus('GPS not supported on this device', false);
    return;
  }

  setStatus('Getting your location...', false);
  document.getElementById('locate-btn').textContent = '⏳';

  if (watchId) navigator.geolocation.clearWatch(watchId);

  watchId = navigator.geolocation.watchPosition(
    (pos) => {
      userLat = pos.coords.latitude;
      userLng = pos.coords.longitude;

      if (userMarker) {
        userMarker.setLatLng([userLat, userLng]);
      } else {
        const userIcon = L.divIcon({
          className: '',
          html: `<div class="user-dot"></div>`,
          iconSize: [16, 16],
          iconAnchor: [8, 8]
        });
        userMarker = L.marker([userLat, userLng], { icon: userIcon }).addTo(map);
        map.setView([userLat, userLng], 15);
      }

      document.getElementById('locate-btn').textContent = '📍';
      setStatus(`Live tracking · ${userLat.toFixed(4)}, ${userLng.toFixed(4)}`, true);

      // Auto-fill from
      document.getElementById('from-input').value = 'My Location';
      selectedFrom = 'MY_LOCATION';

      // Update nearby
      updateNearby();
    },
    (err) => {
      document.getElementById('locate-btn').textContent = '📍';
      setStatus('Could not get location. Check GPS permissions.', false);
    },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
  );
}

function setStatus(msg, tracking) {
  const bar = document.getElementById('status-bar');
  document.getElementById('status-text').textContent = msg;
  bar.className = tracking ? 'tracking' : '';
}

// ═══════════════════════════════════════════════
// NEARBY STOPS
// ═══════════════════════════════════════════════
function updateNearby() {
  if (!userLat || !userLng) return;

  const nearby = stopNames.map(name => {
    const s = STOPS[name];
    const dist = haversine(userLat, userLng, s.lat, s.lng);
    return { name, ...s, dist };
  }).sort((a, b) => a.dist - b.dist).slice(0, 10);

  document.getElementById('nearby-status').textContent = `${nearby.length} stops found near you`;

  const list = document.getElementById('nearby-list');
  list.innerHTML = nearby.map(s => {
    const isBRT = s.routes.some(r => r.startsWith('BRT'));
    const distStr = s.dist < 1 ? `${Math.round(s.dist * 1000)}m` : `${s.dist.toFixed(1)}km`;
    return `
      <div class="nearby-item" onclick="zoomToStop('${s.name}')">
        <div class="nearby-icon">${isBRT ? '🚌' : '🚐'}</div>
        <div class="nearby-info">
          <div class="nearby-name">${s.name}</div>
          <div class="nearby-meta">${s.type} · ${s.routes.length} route${s.routes.length > 1 ? 's' : ''}${s.keke ? ' · 🛺 Keke' : ''}${s.bike ? ' · 🏍️ Bike' : ''}</div>
        </div>
        <div class="nearby-dist">${distStr}</div>
      </div>
    `;
  }).join('');
}

function zoomToStop(name) {
  const s = STOPS[name];
  if (!s) return;
  map.setView([s.lat, s.lng], 16);
  showStopPopup(name, s);
  switchTab('route');
}

// ═══════════════════════════════════════════════
// ROUTE FINDER
// ═══════════════════════════════════════════════
function findRoute() {
  const fromVal = document.getElementById('from-input').value.trim();
  const toVal = document.getElementById('to-input').value.trim();

  if (!fromVal || !toVal) {
    showRouteError('Please enter both origin and destination.');
    return;
  }

  // Resolve from
  let fromStop = fromVal === 'My Location' ? null : findClosestStop(fromVal);
  let toStop = findClosestStop(toVal);

  if (!toStop) {
    showRouteError(`Could not find "${toVal}". Try a nearby bus stop name.`);
    return;
  }

  let fromLat, fromLng, fromName;
  if (fromVal === 'My Location' && userLat) {
    fromLat = userLat; fromLng = userLng; fromName = 'Your Location';
    // Find nearest stop
    fromStop = getNearestStop(userLat, userLng);
  } else if (fromStop) {
    fromLat = STOPS[fromStop].lat; fromLng = STOPS[fromStop].lng; fromName = fromStop;
  } else {
    showRouteError(`Could not find "${fromVal}". Try a nearby bus stop name.`);
    return;
  }

  const toLat = STOPS[toStop].lat, toLng = STOPS[toStop].lng;

  // Clear previous route lines
  routeLines.forEach(l => map.removeLayer(l));
  routeLines = [];

  // Calculate route
  const result = calculateRoute(fromStop || getNearestStop(fromLat, fromLng), toStop);

  // Draw line on map
  const line = L.polyline([[fromLat, fromLng], [toLat, toLng]], {
    color: '#FF6B2B',
    weight: 4,
    opacity: 0.8,
    dashArray: '8,4'
  }).addTo(map);
  routeLines.push(line);

  map.fitBounds([[fromLat, fromLng], [toLat, toLng]], { padding: [40, 40] });

  renderRouteResult(fromName, toStop, fromLat, fromLng, result);
}

function findClosestStop(query) {
  const q = query.toLowerCase().trim();
  // Exact match
  const exact = stopNames.find(n => n.toLowerCase() === q);
  if (exact) return exact;
  // Partial match
  const partial = stopNames.find(n => n.toLowerCase().includes(q) || q.includes(n.toLowerCase()));
  if (partial) return partial;
  return null;
}

function getNearestStop(lat, lng) {
  return stopNames.reduce((nearest, name) => {
    const s = STOPS[name];
    const d = haversine(lat, lng, s.lat, s.lng);
    const nd = nearest ? haversine(lat, lng, STOPS[nearest].lat, STOPS[nearest].lng) : Infinity;
    return d < nd ? name : nearest;
  }, null);
}

function calculateRoute(fromStop, toStop) {
  if (!fromStop || !toStop || fromStop === toStop) return null;

  const fromData = STOPS[fromStop];
  const toData = STOPS[toStop];

  // Find shared routes
  const fromRoutes = fromData.routes;
  const toRoutes = toData.routes;
  const sharedRoutes = fromRoutes.filter(r => toRoutes.includes(r));

  const totalDist = haversine(fromData.lat, fromData.lng, toData.lat, toData.lng);
  const walkToFrom = userLat ? haversine(userLat, userLng, fromData.lat, fromData.lng) : 0;

  const steps = [];

  if (walkToFrom > 0.05) {
    steps.push({
      type: 'walk',
      icon: '🚶',
      title: `Walk to ${fromStop}`,
      detail: `Head to the bus stop`,
      dist: `${Math.round(walkToFrom * 1000)}m`
    });
  }

  if (sharedRoutes.length > 0) {
    // Direct route
    const route = ROUTES[sharedRoutes[0]];
    const routeStops = route.stops;
    const fi = routeStops.indexOf(fromStop);
    const ti = routeStops.indexOf(toStop);
    const stopsInBetween = Math.abs(ti - fi);

    steps.push({
      type: route.type,
      icon: route.type === 'BRT' ? '🚌' : '🚐',
      title: `Board ${route.type} — ${route.name}`,
      detail: `Board at ${fromStop} → Alight at ${toStop} (${stopsInBetween} stop${stopsInBetween !== 1 ? 's' : ''})`,
      dist: `${totalDist.toFixed(1)}km`,
      fare: route.fare,
      routeType: route.type
    });
  } else {
    // Need connection — find intermediate
    const fromRouteData = fromRoutes.map(r => ROUTES[r]).filter(Boolean);
    const toRouteData = toRoutes.map(r => ROUTES[r]).filter(Boolean);

    // Find a connecting stop
    let connection = null;
    for (const fr of fromRoutes) {
      const fRoute = ROUTES[fr];
      if (!fRoute) continue;
      for (const tr of toRoutes) {
        const tRoute = ROUTES[tr];
        if (!tRoute) continue;
        // Check common stops
        const common = fRoute.stops.filter(s => tRoute.stops.includes(s) && s !== fromStop && s !== toStop);
        if (common.length > 0) {
          connection = { via: common[0], fromRoute: fRoute, toRoute: tRoute };
          break;
        }
      }
      if (connection) break;
    }

    if (connection) {
      const dist1 = haversine(fromData.lat, fromData.lng, STOPS[connection.via].lat, STOPS[connection.via].lng);
      const dist2 = haversine(STOPS[connection.via].lat, STOPS[connection.via].lng, toData.lat, toData.lng);
      const fi1 = connection.fromRoute.stops.indexOf(fromStop);
      const ti1 = connection.fromRoute.stops.indexOf(connection.via);
      const fi2 = connection.toRoute.stops.indexOf(connection.via);
      const ti2 = connection.toRoute.stops.indexOf(toStop);

      steps.push({
        type: connection.fromRoute.type,
        icon: connection.fromRoute.type === 'BRT' ? '🚌' : '🚐',
        title: `Board ${connection.fromRoute.type} — ${connection.fromRoute.name}`,
        detail: `Board at ${fromStop} → Alight at ${connection.via} (${Math.abs(ti1-fi1)} stops)`,
        dist: `${dist1.toFixed(1)}km`,
        fare: connection.fromRoute.fare,
        routeType: connection.fromRoute.type
      });
      steps.push({
        type: 'transfer',
        icon: '🔄',
        title: `Transfer at ${connection.via}`,
        detail: `Change to ${connection.toRoute.type}`,
        dist: '~5min'
      });
      steps.push({
        type: connection.toRoute.type,
        icon: connection.toRoute.type === 'BRT' ? '🚌' : '🚐',
        title: `Board ${connection.toRoute.type} — ${connection.toRoute.name}`,
        detail: `Board at ${connection.via} → Alight at ${toStop} (${Math.abs(ti2-fi2)} stops)`,
        dist: `${dist2.toFixed(1)}km`,
        fare: connection.toRoute.fare,
        routeType: connection.toRoute.type
      });
    } else {
      // Generic guidance
      const hub = findNearestHub(fromData.lat, fromData.lng);
      steps.push({
        type: 'danfo',
        icon: '🚐',
        title: `Take Danfo toward ${hub}`,
        detail: `From ${fromStop}, take any bus toward a major terminal`,
        dist: `${(totalDist * 0.4).toFixed(1)}km`,
        fare: '₦100–₦300',
        routeType: 'Danfo'
      });
      steps.push({
        type: 'transfer',
        icon: '🔄',
        title: `Connect at ${hub}`,
        detail: 'Transfer to a bus going toward your destination',
        dist: '~10min'
      });
      steps.push({
        type: 'danfo',
        icon: '🚐',
        title: `Continue to ${toStop}`,
        detail: `Take a bus or keke to ${toStop}`,
        dist: `${(totalDist * 0.6).toFixed(1)}km`,
        fare: '₦100–₦200',
        routeType: 'Danfo'
      });
    }
  }

  // Keke/bike at destination
  if (toData.keke || toData.bike) {
    steps.push({
      type: 'keke',
      icon: toData.bike ? '🏍️' : '🛺',
      title: `${toData.bike ? 'Bike' : 'Keke'} available at ${toStop}`,
      detail: `${toData.bike ? 'Motorcycles' : 'Tricycles'} available for last-mile to your final destination`,
      dist: 'nearby'
    });
  }

  const totalFare = steps.filter(s => s.fare).map(s => {
    const f = s.fare || '₦0';
    const nums = f.match(/\d+/g);
    return nums ? parseInt(nums[nums.length - 1]) : 0;
  }).reduce((a, b) => a + b, 0);

  return { steps, totalDist, totalFare };
}

function findNearestHub(lat, lng) {
  const hubs = ['Oshodi','Mile 12','Ojota','Yaba','CMS','Berger','Mile 2','Iyana Ipaja'];
  return hubs.reduce((nearest, name) => {
    const s = STOPS[name];
    if (!s) return nearest;
    const d = haversine(lat, lng, s.lat, s.lng);
    const nd = nearest ? haversine(lat, lng, STOPS[nearest].lat, STOPS[nearest].lng) : Infinity;
    return d < nd ? name : nearest;
  });
}

function renderRouteResult(fromName, toName, fromLat, fromLng, result) {
  const container = document.getElementById('route-result');

  if (!result) {
    container.innerHTML = `<div class="no-result"><div class="nr-icon">🗺️</div><div class="nr-title">Same location</div><div class="nr-sub">Origin and destination appear to be the same.</div></div>`;
    return;
  }

  const distToFrom = userLat ? haversine(userLat, userLng, fromLat, fromLng) : 0;
  const distStr = result.totalDist < 1 ? `${Math.round(result.totalDist * 1000)}m` : `${result.totalDist.toFixed(1)}km`;

  const stepsHtml = result.steps.map(step => {
    const badge = step.routeType === 'BRT' ? 'badge-brt' : step.routeType === 'Danfo' ? 'badge-danfo' : step.type === 'keke' ? 'badge-keke' : 'badge-walk';
    return `
      <div class="step">
        <div class="step-icon">${step.icon}</div>
        <div class="step-info">
          <div class="step-title">${step.title}</div>
          <div class="step-detail">${step.detail}${step.fare ? ` · <b style="color:var(--green)">${step.fare}</b>` : ''}</div>
        </div>
        <div class="step-dist">${step.dist}</div>
      </div>
    `;
  }).join('');

  container.innerHTML = `
    <div class="route-card">
      <div class="route-card-header">
        <div>
          <div style="font-size:13px;font-weight:700;margin-bottom:2px;">${fromName} → ${toName}</div>
          <div style="font-size:11px;color:var(--muted);">Total distance: ${distStr}</div>
        </div>
        <div class="route-time">${Math.round(result.totalDist * 4 + 10)} min est.</div>
      </div>
      <div class="route-steps">${stepsHtml}</div>
      <div class="fare-row">
        <span class="fare-label">Estimated total fare</span>
        <span class="fare-amount">≈ ₦${result.totalFare.toLocaleString()}</span>
      </div>
    </div>
  `;
}

function showRouteError(msg) {
  document.getElementById('route-result').innerHTML = `
    <div class="no-result">
      <div class="nr-icon">❌</div>
      <div class="nr-title">Route not found</div>
      <div class="nr-sub">${msg}</div>
    </div>`;
}

// ═══════════════════════════════════════════════
// LINES TAB
// ═══════════════════════════════════════════════
function renderLinesTab() {
  const container = document.getElementById('lines-list');
  const brtRoutes = Object.entries(ROUTES).filter(([k]) => k.startsWith('BRT'));
  const danfoRoutes = Object.entries(ROUTES).filter(([k]) => k.startsWith('DANFO'));

  const renderGroup = (title, routes, icon) => `
    <div style="margin-bottom:20px;">
      <div style="font-family:'Syne',sans-serif;font-weight:700;font-size:13px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;">${icon} ${title}</div>
      ${routes.map(([key, route]) => `
        <div class="nearby-item" style="margin-bottom:8px;" onclick="showRouteLine('${key}')">
          <div class="nearby-icon" style="background:${route.color}20;color:${route.color};font-size:14px;">🚌</div>
          <div class="nearby-info">
            <div class="nearby-name">${route.name}</div>
            <div class="nearby-meta">${route.stops.length} stops · ${route.fare}</div>
          </div>
          <div class="nearby-dist" style="color:${route.color};font-size:10px;">${route.type}</div>
        </div>
      `).join('')}
    </div>
  `;

  container.innerHTML = renderGroup('BRT Routes', brtRoutes, '🚌') + renderGroup('Danfo Routes', danfoRoutes, '🚐');
}

function showRouteLine(routeKey) {
  const route = ROUTES[routeKey];
  if (!route) return;

  routeLines.forEach(l => map.removeLayer(l));
  routeLines = [];

  const coords = route.stops.map(s => STOPS[s] ? [STOPS[s].lat, STOPS[s].lng] : null).filter(Boolean);
  if (coords.length < 2) return;

  const line = L.polyline(coords, {
    color: route.color,
    weight: 4,
    opacity: 0.9
  }).addTo(map);
  routeLines.push(line);
  map.fitBounds(line.getBounds(), { padding: [30, 30] });
}

// ═══════════════════════════════════════════════
// AUTOCOMPLETE
// ═══════════════════════════════════════════════
function setupAutocomplete(inputId, listId, onSelect) {
  const input = document.getElementById(inputId);
  const list = document.getElementById(listId);

  input.addEventListener('input', () => {
    const q = input.value.toLowerCase().trim();
    if (!q || q.length < 2) { list.style.display = 'none'; return; }

    const matches = stopNames.filter(n => n.toLowerCase().includes(q)).slice(0, 8);
    if (!matches.length) { list.style.display = 'none'; return; }

    list.innerHTML = matches.map(name => {
      const s = STOPS[name];
      const isBRT = s.routes.some(r => r.startsWith('BRT'));
      return `<div class="autocomplete-item" onclick="selectAC('${inputId}','${listId}','${name}')">
        <span class="ac-icon">${isBRT ? '🚌' : '🚐'}</span>
        <span>
          <span class="ac-name">${name}</span>
          <span class="ac-type" style="display:block;">${s.type}</span>
        </span>
      </div>`;
    }).join('');
    list.style.display = 'block';

    // Store callback
    list._onSelect = onSelect;
  });

  document.addEventListener('click', (e) => {
    if (!input.contains(e.target) && !list.contains(e.target)) {
      list.style.display = 'none';
    }
  });
}

function selectAC(inputId, listId, name) {
  document.getElementById(inputId).value = name;
  const list = document.getElementById(listId);
  list.style.display = 'none';
  if (list._onSelect) list._onSelect(name);
  if (inputId === 'from-input') selectedFrom = name;
  if (inputId === 'to-input') selectedTo = name;
}

// ═══════════════════════════════════════════════
// TABS & PANEL
// ═══════════════════════════════════════════════
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
  document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
  document.getElementById(`tab-${tab}`).style.display = 'block';

  const titles = { route: 'Plan Your Route', nearby: 'Nearby Stops', lines: 'Bus Lines' };
  document.getElementById('panel-title').textContent = titles[tab];

  const panel = document.getElementById('bottom-panel');
  if (panel.classList.contains('collapsed')) {
    panel.classList.remove('collapsed');
  }
}

function togglePanel() {
  document.getElementById('bottom-panel').classList.toggle('collapsed');
}

// ═══════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════
function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ═══════════════════════════════════════════════
// SPLASH → APP
// ═══════════════════════════════════════════════
const splashMessages = ['Loading routes...', 'Mapping bus stops...', 'Building database...', 'Ready!'];
let si = 0;
const statusEl = document.getElementById('splash-status');
const splashInterval = setInterval(() => {
  si++;
  if (si < splashMessages.length) statusEl.textContent = splashMessages[si];
  else clearInterval(splashInterval);
}, 500);

setTimeout(() => {
  document.getElementById('splash').classList.add('hide');
  document.getElementById('app').classList.add('visible');
  init();
}, 2200);
</script>
