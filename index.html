<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Waka Lagos</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --brand: #FF5722;
  --brand2: #FF8A65;
  --brand-glow: rgba(255,87,34,0.15);
  --green: #00E676;
  --green-dim: rgba(0,230,118,0.12);
  --blue: #448AFF;
  --yellow: #FFD740;
  --yellow-dim: rgba(255,215,64,0.12);
  --bg: #0D0D0D;
  --s1: #161616;
  --s2: #1F1F1F;
  --s3: #2A2A2A;
  --border: rgba(255,255,255,0.06);
  --border2: rgba(255,255,255,0.1);
  --text: #F0F0F0;
  --muted: #666;
  --muted2: #999;
  --white: #fff;
  --radius: 14px;
  --radius-sm: 8px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}

/* SPLASH */
#splash{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;}
#splash.out{animation:splashOut 0.5s ease forwards;}
@keyframes splashOut{to{opacity:0;transform:scale(1.05);pointer-events:none;}}
.s-logo{display:flex;align-items:center;gap:12px;}
.s-logo-icon{width:56px;height:56px;background:var(--brand);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 0 40px rgba(255,87,34,0.4);}
.s-logo-text{font-size:36px;font-weight:800;letter-spacing:-1px;}
.s-logo-text span{color:var(--brand);}
.s-tagline{font-size:13px;color:var(--muted2);letter-spacing:3px;text-transform:uppercase;}
.s-bar{width:180px;height:3px;background:var(--s3);border-radius:2px;overflow:hidden;}
.s-bar-fill{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--yellow));border-radius:2px;transition:width 0.4s ease;}
.s-msg{font-size:12px;color:var(--muted);font-family:'Space Mono',monospace;}

/* APP */
#app{height:100vh;display:flex;flex-direction:column;opacity:0;transition:opacity 0.4s;}
#app.on{opacity:1;}

/* TOPBAR */
#topbar{background:var(--s1);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:10px;z-index:200;flex-shrink:0;}
.t-logo{font-size:18px;font-weight:800;letter-spacing:-0.5px;flex-shrink:0;}
.t-logo span{color:var(--brand);}
.t-search{flex:1;position:relative;}
#search-input{width:100%;background:var(--s2);border:1.5px solid var(--border);border-radius:10px;padding:9px 12px 9px 34px;color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;outline:none;transition:border-color 0.2s;}
#search-input:focus{border-color:var(--brand);}
#search-input::placeholder{color:var(--muted);}
.t-search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none;}
#gps-btn{width:38px;height:38px;background:var(--brand);border:none;border-radius:10px;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s;box-shadow:0 2px 12px rgba(255,87,34,0.3);}
#gps-btn:active{transform:scale(0.93);}
#gps-btn.pulsing{animation:gpsAnim 1.5s ease infinite;}
@keyframes gpsAnim{0%,100%{box-shadow:0 2px 12px rgba(255,87,34,0.3);}50%{box-shadow:0 2px 24px rgba(255,87,34,0.7);}}

/* STATUS */
#statusbar{padding:5px 14px;background:var(--s1);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px;font-size:11px;font-family:'Space Mono',monospace;flex-shrink:0;}
.s-dot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex-shrink:0;}
#statusbar.live .s-dot{background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 2s infinite;}
#statusbar.live{color:var(--green);}
#statusbar.err{color:#FF5252;}
@keyframes blink{50%{opacity:0.3;}}

/* MAP */
#map{flex:1;z-index:1;min-height:0;}
.leaflet-container{background:#111;}

/* Better map - CartoDB dark */
/* BOTTOM SHEET */
#sheet{background:var(--s1);border-top:1.5px solid var(--border2);z-index:200;flex-shrink:0;display:flex;flex-direction:column;max-height:60vh;transition:max-height 0.35s cubic-bezier(0.4,0,0.2,1);}
#sheet.min{max-height:52px;overflow:hidden;}

.sheet-drag{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px;cursor:pointer;flex-shrink:0;}
.drag-pill{width:36px;height:4px;background:var(--s3);border-radius:2px;}
.sheet-title{font-size:14px;font-weight:700;}
.sheet-arr{font-size:12px;color:var(--muted);transition:transform 0.3s;}
#sheet.min .sheet-arr{transform:rotate(180deg);}

/* TABS */
.tabs{display:flex;padding:0 14px;gap:2px;border-bottom:1px solid var(--border);flex-shrink:0;}
.tab{padding:9px 12px;font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;background:none;border:none;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s;}
.tab.on{color:var(--brand);border-bottom-color:var(--brand);}

.tab-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.tab-body::-webkit-scrollbar{display:none;}

/* ROUTE TAB */
.r-form{padding:14px;}
.r-row{display:flex;gap:10px;align-items:flex-start;}
.r-dots{display:flex;flex-direction:column;align-items:center;padding-top:11px;gap:0;}
.r-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.r-dot.from{background:var(--green);box-shadow:0 0 8px var(--green);}
.r-dot.to{background:var(--brand);box-shadow:0 0 8px var(--brand);}
.r-dline{width:2px;flex:1;min-height:18px;background:linear-gradient(var(--green),var(--brand));opacity:0.3;}
.r-inputs{flex:1;display:flex;flex-direction:column;gap:8px;}
.r-inp-wrap{position:relative;}
.r-inp{width:100%;background:var(--s2);border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;outline:none;transition:border-color 0.2s;}
.r-inp:focus{border-color:var(--brand);}
.r-inp::placeholder{color:var(--muted);}
.r-swap{width:28px;height:28px;background:var(--s3);border:1px solid var(--border2);border-radius:8px;color:var(--muted2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:9px;transition:all 0.2s;}
.r-swap:active{transform:rotate(180deg);}

#go-btn{width:100%;background:var(--brand);border:none;border-radius:12px;padding:13px;color:#fff;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:15px;cursor:pointer;margin-top:12px;transition:all 0.2s;box-shadow:0 4px 16px rgba(255,87,34,0.3);letter-spacing:0.3px;}
#go-btn:active{transform:scale(0.98);box-shadow:none;}

/* RESULT */
#r-result{padding:0 14px 14px;}

.result-header{background:var(--s2);border-radius:var(--radius);padding:14px;margin-bottom:12px;border:1px solid var(--border);}
.rh-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.rh-from-to{font-size:13px;font-weight:700;line-height:1.4;}
.rh-from-to .arrow{color:var(--muted);margin:0 4px;}
.rh-meta{display:flex;gap:8px;flex-wrap:wrap;}
.meta-chip{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:600;}
.chip-time{background:rgba(68,138,255,0.12);color:var(--blue);border:1px solid rgba(68,138,255,0.25);}
.chip-dist{background:var(--s3);color:var(--muted2);border:1px solid var(--border);}
.chip-fare{background:var(--green-dim);color:var(--green);border:1px solid rgba(0,230,118,0.25);}

.steps{display:flex;flex-direction:column;gap:2px;}
.step{display:flex;gap:10px;align-items:stretch;position:relative;}
.step-left{display:flex;flex-direction:column;align-items:center;gap:0;width:36px;flex-shrink:0;}
.step-icon-wrap{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.icon-brt{background:rgba(68,138,255,0.12);border:1px solid rgba(68,138,255,0.25);}
.icon-danfo{background:rgba(255,215,64,0.12);border:1px solid rgba(255,215,64,0.25);}
.icon-walk{background:var(--s3);border:1px solid var(--border);}
.icon-keke{background:rgba(0,230,118,0.12);border:1px solid rgba(0,230,118,0.25);}
.icon-transfer{background:rgba(255,87,34,0.1);border:1px solid rgba(255,87,34,0.2);}
.step-line-v{width:2px;flex:1;min-height:8px;background:var(--border2);margin:2px 0;}
.step-content{flex:1;padding:0 0 14px 0;}
.step-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:3px;line-height:1.3;}
.step-detail{font-size:12px;color:var(--muted2);line-height:1.5;}
.step-fare{display:inline-block;margin-top:5px;font-size:11px;font-weight:700;color:var(--green);background:var(--green-dim);padding:2px 8px;border-radius:20px;border:1px solid rgba(0,230,118,0.2);}
.step-dist-badge{display:inline-block;margin-top:5px;margin-left:4px;font-size:11px;color:var(--muted2);background:var(--s3);padding:2px 8px;border-radius:20px;font-family:'Space Mono',monospace;}

/* NEARBY */
.nearby-wrap{padding:14px;}
.nb-info{background:var(--s2);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--muted2);display:flex;align-items:center;gap:8px;margin-bottom:12px;border:1px solid var(--border);}
.nb-list{display:flex;flex-direction:column;gap:8px;}
.nb-item{background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:all 0.2s;-webkit-tap-highlight-color:transparent;}
.nb-item:active{background:rgba(255,87,34,0.06);border-color:rgba(255,87,34,0.3);}
.nb-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.nb-info-col{flex:1;min-width:0;}
.nb-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nb-meta{font-size:11px;color:var(--muted2);margin-top:2px;}
.nb-dist{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:var(--brand);flex-shrink:0;}

/* LINES */
.lines-wrap{padding:14px;}
.lines-group-title{font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;margin-top:16px;}
.lines-group-title:first-child{margin-top:0;}
.line-item{background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px;margin-bottom:8px;cursor:pointer;transition:all 0.2s;}
.line-item:active{border-color:var(--brand);background:var(--brand-glow);}
.line-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
.line-info{flex:1;}
.line-name{font-size:13px;font-weight:700;margin-bottom:2px;}
.line-meta{font-size:11px;color:var(--muted2);}
.line-badge{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:700;flex-shrink:0;}
.badge-BRT{background:rgba(68,138,255,0.12);color:var(--blue);border:1px solid rgba(68,138,255,0.3);}
.badge-Danfo{background:rgba(255,215,64,0.12);color:var(--yellow);border:1px solid rgba(255,215,64,0.3);}

/* AUTOCOMPLETE */
.ac-list{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--s2);border:1.5px solid var(--border2);border-radius:10px;z-index:9999;max-height:180px;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,0.6);}
.ac-list::-webkit-scrollbar{display:none;}
.ac-item{padding:10px 12px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background 0.15s;border-bottom:1px solid var(--border);}
.ac-item:last-child{border-bottom:none;}
.ac-item:active{background:rgba(255,87,34,0.08);}
.ac-ico{font-size:15px;flex-shrink:0;}
.ac-name{font-weight:600;color:var(--text);}
.ac-type{font-size:10px;color:var(--muted);margin-top:1px;}

/* POPUP */
.leaflet-popup-content-wrapper{background:var(--s2)!important;color:var(--text)!important;border:1px solid var(--border2)!important;border-radius:12px!important;box-shadow:0 8px 32px rgba(0,0,0,0.6)!important;padding:0!important;}
.leaflet-popup-content{margin:0!important;}
.leaflet-popup-tip{background:var(--s2)!important;}
.leaflet-popup-close-button{color:var(--muted2)!important;font-size:18px!important;top:8px!important;right:10px!important;}
.popup-inner{padding:14px 16px;}
.popup-name{font-size:14px;font-weight:800;margin-bottom:4px;}
.popup-type{font-size:11px;color:var(--muted2);margin-bottom:8px;}
.popup-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
.popup-tag{font-size:10px;padding:3px 8px;border-radius:20px;background:rgba(255,87,34,0.1);color:var(--brand);border:1px solid rgba(255,87,34,0.25);font-weight:600;}
.popup-extras{font-size:11px;color:var(--muted2);}

/* USER MARKER */
.umarker{width:18px;height:18px;background:var(--blue);border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 5px rgba(68,138,255,0.25),0 2px 8px rgba(0,0,0,0.4);}

/* EMPTY STATE */
.empty{text-align:center;padding:28px 16px;}
.empty-ico{font-size:38px;margin-bottom:10px;}
.empty-title{font-size:16px;font-weight:800;margin-bottom:6px;}
.empty-sub{font-size:13px;color:var(--muted2);line-height:1.5;}

/* MAP CONTROLS */
.leaflet-control-zoom{border:none!important;box-shadow:none!important;}
.leaflet-control-zoom a{background:var(--s2)!important;color:var(--text)!important;border:1px solid var(--border2)!important;border-radius:8px!important;margin-bottom:4px!important;display:block!important;font-size:18px!important;line-height:26px!important;width:28px!important;height:28px!important;}

/* FAB */
#fab-locate{position:absolute;bottom:16px;right:16px;z-index:100;width:48px;height:48px;background:var(--brand);border:none;border-radius:50%;color:#fff;font-size:22px;cursor:pointer;box-shadow:0 4px 20px rgba(255,87,34,0.4);display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
#fab-locate:active{transform:scale(0.92);}

</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="s-logo">
    <div class="s-logo-icon">🚌</div>
    <div class="s-logo-text">Waka<span>Lagos</span></div>
  </div>
  <div class="s-tagline">Navigate the City</div>
  <div class="s-bar"><div class="s-bar-fill" id="sbar"></div></div>
  <div class="s-msg" id="smsg">Loading routes...</div>
</div>

<!-- APP -->
<div id="app">
  <!-- TOPBAR -->
  <div id="topbar">
    <div class="t-logo">Waka<span>Lagos</span></div>
    <div class="t-search">
      <span class="t-search-icon">🔍</span>
      <input id="search-input" type="text" placeholder="Search any bus stop..." autocomplete="off">
      <div class="ac-list" id="ac-search" style="display:none;"></div>
    </div>
    <button id="gps-btn">📍</button>
  </div>

  <!-- STATUS -->
  <div id="statusbar">
    <div class="s-dot"></div>
    <span id="s-text">Tap 📍 to start live tracking</span>
  </div>

  <!-- MAP -->
  <div style="position:relative;flex:1;min-height:0;">
    <div id="map"></div>
    <button id="fab-locate">📍</button>
  </div>

  <!-- BOTTOM SHEET -->
  <div id="sheet">
    <div class="sheet-drag" id="sheet-drag">
      <div class="drag-pill"></div>
      <div class="sheet-title" id="sheet-title">Plan Route</div>
      <div class="sheet-arr">▲</div>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="route">🗺 Route</button>
      <button class="tab" data-tab="nearby">📍 Nearby</button>
      <button class="tab" data-tab="lines">🚌 Lines</button>
    </div>
    <div class="tab-body">

      <!-- ROUTE -->
      <div id="tab-route">
        <div class="r-form">
          <div class="r-row">
            <div class="r-dots">
              <div class="r-dot from"></div>
              <div class="r-dline"></div>
              <div class="r-dot to"></div>
            </div>
            <div class="r-inputs">
              <div class="r-inp-wrap">
                <input class="r-inp" id="from-inp" type="text" placeholder="From — current location or stop" autocomplete="off">
                <div class="ac-list" id="ac-from" style="display:none;"></div>
              </div>
              <div class="r-inp-wrap">
                <input class="r-inp" id="to-inp" type="text" placeholder="To — destination" autocomplete="off">
                <div class="ac-list" id="ac-to" style="display:none;"></div>
              </div>
            </div>
            <button class="r-swap" id="swap-btn">⇅</button>
          </div>
          <button id="go-btn">Find Route →</button>
        </div>
        <div id="r-result"></div>
      </div>

      <!-- NEARBY -->
      <div id="tab-nearby" style="display:none;">
        <div class="nearby-wrap">
          <div class="nb-info">📍 <span id="nb-status">Tap the locate button to find stops near you</span></div>
          <div class="nb-list" id="nb-list"></div>
        </div>
      </div>

      <!-- LINES -->
      <div id="tab-lines" style="display:none;">
        <div class="lines-wrap" id="lines-wrap"></div>
      </div>

    </div>
  </div>
</div>

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
function initApp() {
  // Map with CartoDB dark tiles for much better look
  map = L.map('map', {
    center: [6.5244, 3.3792],
    zoom: 12,
    zoomControl: false,
    attributionControl: false
  });

  // Primary dark tiles with OSM fallback
  const cartoTile = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {subdomains:'abcd',maxZoom:19});
  const osmTile = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19});
  cartoTile.addTo(map);
  cartoTile.on('tileerror', () => { map.removeLayer(cartoTile); osmTile.addTo(map); });

  L.control.zoom({ position: 'topright' }).addTo(map);
  L.control.attribution({ position: 'bottomleft', prefix: '' }).addTo(map);

  plotStops();
  renderLines();

  // Events
  document.getElementById('gps-btn').addEventListener('click', locateUser);
  document.getElementById('fab-locate').addEventListener('click', locateUser);
  document.getElementById('sheet-drag').addEventListener('click', toggleSheet);
  document.getElementById('go-btn').addEventListener('click', doRoute);
  document.getElementById('swap-btn').addEventListener('click', swapInputs);

  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => switchTab(t.dataset.tab));
  });

  bindAC('search-input', 'ac-search', name => {
    const s = STOPS[name];
    map.setView([s.lat, s.lng], 16);
    openPopup(name, s);
    document.getElementById('search-input').value = '';
  });
  bindAC('from-inp', 'ac-from', name => { document.getElementById('from-inp').value = name; });
  bindAC('to-inp', 'ac-to', name => { document.getElementById('to-inp').value = name; });
}

// ══════════════════════════════════════════
// MAP
// ══════════════════════════════════════════
function plotStops() {
  stopKeys.forEach(name => {
    const s = STOPS[name];
    const isBRT = s.routes.some(r => r.startsWith('BRT'));
    const isTerminal = s.type.includes('Terminal');
    const sz = isTerminal ? 13 : 8;
    const col = isBRT ? '#448AFF' : '#FFD740';
    const glow = isBRT ? 'rgba(68,138,255,0.6)' : 'rgba(255,215,64,0.5)';

    const icon = L.divIcon({
      className: '',
      html: `<div style="width:${sz}px;height:${sz}px;background:${col};border:2px solid ${isBRT?'rgba(68,138,255,0.4)':'rgba(255,215,64,0.4)'};border-radius:50%;box-shadow:0 0 ${isTerminal?10:5}px ${glow};"></div>`,
      iconSize: [sz, sz],
      iconAnchor: [sz/2, sz/2]
    });

    L.marker([s.lat, s.lng], { icon })
      .addTo(map)
      .on('click', () => openPopup(name, s));
  });
}

function openPopup(name, s) {
  const extras = [];
  if (s.keke) extras.push('🛺 Keke');
  if (s.bike) extras.push('🏍️ Bike');
  const routeTags = s.routes.map(r => ROUTES[r] ? `<span class="popup-tag">${ROUTES[r].name}</span>` : '').join('');

  L.popup({ maxWidth: 260, className: '' })
    .setLatLng([s.lat, s.lng])
    .setContent(`<div class="popup-inner">
      <div class="popup-name">${name}</div>
      <div class="popup-type">${s.type}</div>
      <div class="popup-tags">${routeTags}</div>
      ${extras.length ? `<div class="popup-extras">${extras.join(' · ')}</div>` : ''}
    </div>`)
    .openOn(map);
}

// ══════════════════════════════════════════
// GPS
// ══════════════════════════════════════════
function locateUser() {
  if (!navigator.geolocation) { setStatus('GPS not available', 'err'); return; }
  const btn = document.getElementById('gps-btn');
  btn.textContent = '⏳';
  btn.classList.add('pulsing');
  setStatus('Getting your location...', '');

  if (watchId) navigator.geolocation.clearWatch(watchId);

  watchId = navigator.geolocation.watchPosition(pos => {
    userLat = pos.coords.latitude;
    userLng = pos.coords.longitude;
    const acc = Math.round(pos.coords.accuracy);

    if (!userMarker) {
      const icon = L.divIcon({ className:'', html:`<div class="umarker"></div>`, iconSize:[18,18], iconAnchor:[9,9] });
      userMarker = L.marker([userLat,userLng],{icon,zIndexOffset:1000}).addTo(map);
      map.setView([userLat,userLng],15);
    } else {
      userMarker.setLatLng([userLat,userLng]);
    }

    btn.textContent = '📍';
    btn.classList.remove('pulsing');
    setStatus(`Live · ±${acc}m accuracy`, 'live');
    document.getElementById('from-inp').value = 'My Location';
    updateNearby();
  }, err => {
    btn.textContent = '📍';
    btn.classList.remove('pulsing');
    const msgs = {1:'Location permission denied — enable in browser settings',2:'GPS signal lost',3:'Location timed out'};
    setStatus(msgs[err.code]||'Location error', 'err');
  }, { enableHighAccuracy: true, maximumAge: 3000, timeout: 20000 });
}

function setStatus(msg, cls) {
  const bar = document.getElementById('statusbar');
  document.getElementById('s-text').textContent = msg;
  bar.className = cls ? cls : '';
  if(!cls) bar.removeAttribute('class');
}

// ══════════════════════════════════════════
// NEARBY
// ══════════════════════════════════════════
function updateNearby() {
  if (!userLat) return;
  const sorted = stopKeys.map(n => ({n, d: dist(userLat,userLng,STOPS[n].lat,STOPS[n].lng)}))
    .sort((a,b)=>a.d-b.d).slice(0,12);

  document.getElementById('nb-status').textContent = `${sorted.length} stops near you`;
  document.getElementById('nb-list').innerHTML = sorted.map(({n,d}) => {
    const s = STOPS[n];
    const isBRT = s.routes.some(r=>r.startsWith('BRT'));
    const dStr = d < 1 ? `${Math.round(d*1000)}m` : `${d.toFixed(1)}km`;
    const extras = [s.keke?'🛺':'',s.bike?'🏍️':''].filter(Boolean).join(' ');
    return `<div class="nb-item" onclick="focusStop('${n}')">
      <div class="nb-icon" style="background:${isBRT?'rgba(68,138,255,0.1)':'rgba(255,215,64,0.1)'};">${isBRT?'🚌':'🚐'}</div>
      <div class="nb-info-col">
        <div class="nb-name">${n}</div>
        <div class="nb-meta">${s.type}${extras?' · '+extras:''}</div>
      </div>
      <div class="nb-dist">${dStr}</div>
    </div>`;
  }).join('');
}

function focusStop(name) {
  const s = STOPS[name];
  map.setView([s.lat,s.lng],16);
  openPopup(name,s);
  switchTab('route');
  if(document.getElementById('sheet').classList.contains('min'))
    document.getElementById('sheet').classList.remove('min');
}

// ══════════════════════════════════════════
// ROUTING
// ══════════════════════════════════════════
function doRoute() {
  const fv = document.getElementById('from-inp').value.trim();
  const tv = document.getElementById('to-inp').value.trim();
  if (!fv || !tv) { showErr('Enter both origin and destination.'); return; }

  let fromStop, fromLat, fromLng, fromLabel;

  if ((fv === 'My Location' || fv.toLowerCase() === 'my location') && userLat) {
    fromLat = userLat; fromLng = userLng; fromLabel = 'Your Location';
    fromStop = nearestStop(userLat, userLng);
  } else {
    fromStop = matchStop(fv);
    if (!fromStop) { showErr(`Could not find "${fv}". Try a stop name.`); return; }
    fromLat = STOPS[fromStop].lat; fromLng = STOPS[fromStop].lng; fromLabel = fromStop;
  }

  const toStop = matchStop(tv);
  if (!toStop) { showErr(`Could not find "${tv}". Try a stop name.`); return; }

  clearRouteLines();

  // Draw dashed route line
  const toData = STOPS[toStop];
  const line = L.polyline([[fromLat,fromLng],[toData.lat,toData.lng]],{
    color:'#FF5722', weight:4, opacity:0.85, dashArray:'10,6'
  }).addTo(map);
  routeLayers.push(line);
  map.fitBounds([[fromLat,fromLng],[toData.lat,toData.lng]],{padding:[50,50]});

  const result = buildRoute(fromStop, toStop, fromLat, fromLng);
  renderResult(fromLabel, toStop, result);

  // Expand sheet
  document.getElementById('sheet').classList.remove('min');
}

function buildRoute(fromStop, toStop, fLat, fLng) {
  const fData = STOPS[fromStop], tData = STOPS[toStop];
  if (!fData || !tData) return null;
  const totalDist = dist(fLat, fLng, tData.lat, tData.lng);
  const steps = [];

  // Walk to from stop
  if (userLat) {
    const w = dist(userLat,userLng,fData.lat,fData.lng);
    if (w > 0.08) steps.push({type:'walk',icon:'🚶',cls:'icon-walk',title:`Walk to ${fromStop}`,detail:`Approximately ${Math.round(w*1000)}m on foot`,dist:`${Math.round(w*1000)}m`});
  }

  // Find direct route
  const shared = fData.routes.filter(r => tData.routes.includes(r));
  if (shared.length) {
    const r = ROUTES[shared[0]];
    if (r) {
      const fi = r.stops.indexOf(fromStop), ti = r.stops.indexOf(toStop);
      const n = Math.abs(ti-fi);
      const direction = ti > fi ? '→' : '←';
      steps.push({
        type:r.type,
        icon: r.type==='BRT'?'🚌':'🚐',
        cls: r.type==='BRT'?'icon-brt':'icon-danfo',
        title:`${r.type === 'BRT' ? 'BRT Bus' : 'Danfo'} — ${r.name}`,
        detail:`Board at <b>${fromStop}</b> ${direction} Alight at <b>${toStop}</b> · ${n} stop${n!==1?'s':''}`,
        fare: r.fare,
        dist: `${dist(fData.lat,fData.lng,tData.lat,tData.lng).toFixed(1)}km`
      });
    }
  } else {
    // Find connection via shared hub
    let connected = false;
    for (const fr of fData.routes) {
      for (const tr of tData.routes) {
        const rFrom = ROUTES[fr], rTo = ROUTES[tr];
        if (!rFrom || !rTo) continue;
        const common = rFrom.stops.filter(s => rTo.stops.includes(s) && s !== fromStop && s !== toStop);
        if (common.length) {
          const via = common[0];
          const fi1=rFrom.stops.indexOf(fromStop),ti1=rFrom.stops.indexOf(via);
          const fi2=rTo.stops.indexOf(via),ti2=rTo.stops.indexOf(toStop);
          const d1 = dist(fData.lat,fData.lng,STOPS[via].lat,STOPS[via].lng);
          const d2 = dist(STOPS[via].lat,STOPS[via].lng,tData.lat,tData.lng);
          steps.push({type:rFrom.type,icon:rFrom.type==='BRT'?'🚌':'🚐',cls:rFrom.type==='BRT'?'icon-brt':'icon-danfo',
            title:`${rFrom.type} — ${rFrom.name}`,
            detail:`Board at <b>${fromStop}</b> → Alight at <b>${via}</b> · ${Math.abs(ti1-fi1)} stops`,
            fare:rFrom.fare, dist:`${d1.toFixed(1)}km`});
          steps.push({type:'transfer',icon:'🔄',cls:'icon-transfer',
            title:`Transfer at ${via}`,
            detail:`Change to ${rTo.type} heading toward ${toStop}`,
            dist:'~5 min'});
          steps.push({type:rTo.type,icon:rTo.type==='BRT'?'🚌':'🚐',cls:rTo.type==='BRT'?'icon-brt':'icon-danfo',
            title:`${rTo.type} — ${rTo.name}`,
            detail:`Board at <b>${via}</b> → Alight at <b>${toStop}</b> · ${Math.abs(ti2-fi2)} stops`,
            fare:rTo.fare, dist:`${d2.toFixed(1)}km`});
          connected = true; break;
        }
      }
      if (connected) break;
    }

    if (!connected) {
      // Fallback through nearest hub
      const hub = bestHub(fData.lat,fData.lng);
      steps.push({type:'Danfo',icon:'🚐',cls:'icon-danfo',
        title:`Danfo toward ${hub}`,detail:`Take any bus heading to ${hub}, a major transfer point`,
        fare:'₦100–₦300',dist:`${dist(fData.lat,fData.lng,STOPS[hub].lat,STOPS[hub].lng).toFixed(1)}km`});
      steps.push({type:'transfer',icon:'🔄',cls:'icon-transfer',
        title:`Connect at ${hub}`,detail:`Board a bus or BRT heading toward ${toStop}`,dist:'~10 min'});
      steps.push({type:'Danfo',icon:'🚐',cls:'icon-danfo',
        title:`Continue to ${toStop}`,detail:`Take the bus headed toward your destination`,
        fare:'₦100–₦200',dist:`${dist(STOPS[hub].lat,STOPS[hub].lng,tData.lat,tData.lng).toFixed(1)}km`});
    }
  }

  // Keke/bike at destination
  if (tData.keke||tData.bike) {
    steps.push({type:'keke',icon:tData.bike?'🏍️':'🛺',cls:'icon-keke',
      title:`${tData.bike?'Bike (Okada)':'Keke Napep'} available at ${toStop}`,
      detail:`Last-mile options available at this stop for nearby streets`,
      dist:'nearby'});
  }

  const estMins = Math.round(totalDist*5+steps.filter(s=>s.type==='transfer').length*8+10);

  return {steps,totalDist,estMins};
}

function renderResult(fromLabel, toStop, r) {
  const el = document.getElementById('r-result');
  if (!r) { el.innerHTML=''; return; }
  const dStr = r.totalDist<1?`${Math.round(r.totalDist*1000)}m`:`${r.totalDist.toFixed(1)}km`;

  const stepsHTML = r.steps.map((s,i) => `
    <div class="step">
      <div class="step-left">
        <div class="step-icon-wrap ${s.cls}">${s.icon}</div>
        ${i<r.steps.length-1?'<div class="step-line-v"></div>':''}
      </div>
      <div class="step-content">
        <div class="step-title">${s.title}</div>
        <div class="step-detail">${s.detail}</div>
        <div>
          <span class="step-dist-badge">${s.dist}</span>
        </div>
      </div>
    </div>`).join('');

  el.innerHTML = `
    <div class="result-header">
      <div class="rh-row">
        <div class="rh-from-to">${fromLabel}<span class="arrow">→</span>${toStop}</div>
      </div>
      <div class="rh-meta">
        <span class="meta-chip chip-time">⏱ ~${r.estMins} min</span>
        <span class="meta-chip chip-dist">📏 ${dStr}</span>
      </div>
    </div>
    <div class="steps">${stepsHTML}</div>
  `;
}

function showErr(msg) {
  document.getElementById('r-result').innerHTML = `
    <div class="empty"><div class="empty-ico">🔍</div>
    <div class="empty-title">Not found</div>
    <div class="empty-sub">${msg}</div></div>`;
}

function clearRouteLines() { routeLayers.forEach(l=>map.removeLayer(l)); routeLayers=[]; }

// ══════════════════════════════════════════
// LINES TAB
// ══════════════════════════════════════════
function renderLines() {
  const brt = Object.entries(ROUTES).filter(([k])=>k.startsWith('BRT'));
  const danfo = Object.entries(ROUTES).filter(([k])=>k.startsWith('DANFO'));
  const wrap = document.getElementById('lines-wrap');

  const renderGroup = (title,routes) => `
    <div class="lines-group-title">${title}</div>
    ${routes.map(([k,r])=>`
      <div class="line-item" onclick="drawLine('${k}')">
        <div class="line-dot" style="background:${r.color};box-shadow:0 0 8px ${r.color}66;"></div>
        <div class="line-info">
          <div class="line-name">${r.name}</div>
          <div class="line-meta">${r.stops.length} stops</div>
        </div>
        <span class="line-badge badge-${r.type}">${r.type}</span>
      </div>`).join('')}`;

  wrap.innerHTML = renderGroup('🔵 BRT Routes', brt) + renderGroup('🟡 Danfo Routes', danfo);
}

function drawLine(key) {
  clearRouteLines();
  const r = ROUTES[key];
  if (!r) return;
  const coords = r.stops.map(s=>STOPS[s]?[STOPS[s].lat,STOPS[s].lng]:null).filter(Boolean);
  if (coords.length < 2) return;
  const line = L.polyline(coords,{color:r.color,weight:5,opacity:0.9}).addTo(map);
  routeLayers.push(line);
  map.fitBounds(line.getBounds(),{padding:[40,40]});
}

// ══════════════════════════════════════════
// AUTOCOMPLETE
// ══════════════════════════════════════════
function bindAC(inputId, listId, onPick) {
  const inp = document.getElementById(inputId);
  const list = document.getElementById(listId);
  inp.addEventListener('input', () => {
    const q = inp.value.toLowerCase().trim();
    if (q.length < 2) { list.style.display='none'; return; }
    const hits = stopKeys.filter(n=>n.toLowerCase().includes(q)).slice(0,8);
    if (!hits.length) { list.style.display='none'; return; }
    list.innerHTML = hits.map(n => {
      const s = STOPS[n];
      const isBRT = s.routes.some(r=>r.startsWith('BRT'));
      return `<div class="ac-item" onclick="pickAC('${inputId}','${listId}','${n}')">
        <span class="ac-ico">${isBRT?'🚌':'🚐'}</span>
        <span><div class="ac-name">${n}</div><div class="ac-type">${s.type}</div></span>
      </div>`;
    }).join('');
    list.style.display='block';
    list._cb = onPick;
  });
  document.addEventListener('click', e => {
    if (!inp.contains(e.target) && !list.contains(e.target)) list.style.display='none';
  });
}

function pickAC(inputId, listId, name) {
  document.getElementById(inputId).value = name;
  document.getElementById(listId).style.display='none';
  const cb = document.getElementById(listId)._cb;
  if (cb) cb(name);
}

// ══════════════════════════════════════════
// TABS + SHEET
// ══════════════════════════════════════════
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===tab));
  ['route','nearby','lines'].forEach(t=>document.getElementById('tab-'+t).style.display=t===tab?'':'none');
  const titles={route:'Plan Route',nearby:'Nearby Stops',lines:'Bus Lines'};
  document.getElementById('sheet-title').textContent=titles[tab];
  document.getElementById('sheet').classList.remove('min');
}

function toggleSheet() {
  document.getElementById('sheet').classList.toggle('min');
}

function swapInputs() {
  const f=document.getElementById('from-inp'), t=document.getElementById('to-inp');
  [f.value,t.value]=[t.value,f.value];
}

// ══════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════
function dist(la1,lo1,la2,lo2){
  const R=6371,dLa=(la2-la1)*Math.PI/180,dLo=(lo2-lo1)*Math.PI/180;
  const a=Math.sin(dLa/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLo/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function nearestStop(lat,lng){
  return stopKeys.reduce((best,n)=>dist(lat,lng,STOPS[n].lat,STOPS[n].lng)<dist(lat,lng,STOPS[best].lat,STOPS[best].lng)?n:best);
}
function matchStop(q){
  const lq=q.toLowerCase().trim();
  return stopKeys.find(n=>n.toLowerCase()===lq)||stopKeys.find(n=>n.toLowerCase().includes(lq)||lq.includes(n.toLowerCase().split(' ')[0]))||null;
}
function bestHub(lat,lng){
  const hubs=['Oshodi','Mile 12','Ojota','Yaba','CMS','Berger','Mile 2','Iyana Ipaja','TBS'];
  return hubs.reduce((b,h)=>STOPS[h]&&dist(lat,lng,STOPS[h].lat,STOPS[h].lng)<dist(lat,lng,STOPS[b].lat,STOPS[b].lng)?h:b,'Oshodi');
}
