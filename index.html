<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Waka Lagos</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --brand:#1A73E8;--brand-dk:#1557B0;--brand-lt:#E8F0FE;
  --green:#0F9D58;--green-lt:#E6F4EA;
  --orange:#F4511E;--orange-lt:#FCE8E6;
  --yellow:#F9AB00;--yellow-lt:#FEF7E0;
  --purple:#7B1FA2;--purple-lt:#F3E5F5;
  --red:#D93025;
  --bg:#F8F9FA;--white:#FFFFFF;
  --s1:#F1F3F4;--s2:#E8EAED;
  --text:#202124;--muted:#5F6368;--muted2:#9AA0A6;
  --border:#DADCE0;--shadow:0 1px 3px rgba(0,0,0,0.12),0 1px 2px rgba(0,0,0,0.08);
  --shadow-md:0 4px 12px rgba(0,0,0,0.12);--shadow-lg:0 8px 24px rgba(0,0,0,0.15);
  --r:12px;--r-sm:8px;--r-full:100px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);}

/* ── SPLASH ── */
#splash{position:fixed;inset:0;background:var(--white);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
#splash.out{animation:fadeOut 0.4s forwards;}
@keyframes fadeOut{to{opacity:0;pointer-events:none;}}
.sp-icon{width:72px;height:72px;background:var(--brand);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:36px;box-shadow:0 8px 32px rgba(26,115,232,0.3);}
.sp-name{font-size:28px;font-weight:700;letter-spacing:-0.5px;color:var(--text);}
.sp-name span{color:var(--brand);}
.sp-sub{font-size:13px;color:var(--muted);letter-spacing:1px;}
.sp-bar{width:160px;height:3px;background:var(--s2);border-radius:2px;overflow:hidden;margin-top:8px;}
.sp-fill{height:100%;width:0;background:var(--brand);border-radius:2px;transition:width 0.35s ease;}
.sp-msg{font-size:11px;color:var(--muted2);}

/* ── APP ── */
#app{height:100vh;display:flex;flex-direction:column;opacity:0;transition:opacity 0.3s;}
#app.on{opacity:1;}

/* ── MAP CONTAINER ── */
#map-wrap{position:relative;flex:1;min-height:0;}
#map{width:100%;height:100%;}

/* ── TOP SEARCH CARD ── */
#search-card{position:absolute;top:12px;left:12px;right:12px;z-index:400;background:var(--white);border-radius:var(--r);box-shadow:var(--shadow-md);overflow:visible;}

.sc-row1{display:flex;align-items:center;gap:10px;padding:10px 12px;}
.sc-logo{font-size:16px;font-weight:700;color:var(--brand);letter-spacing:-0.3px;flex-shrink:0;}
.sc-logo span{color:var(--text);}
.sc-input-wrap{flex:1;position:relative;}
#main-search{width:100%;border:none;outline:none;font-family:'Inter',sans-serif;font-size:14px;color:var(--text);background:transparent;padding:2px 0;}
#main-search::placeholder{color:var(--muted2);}
.sc-search-ico{position:absolute;right:0;top:50%;transform:translateY(-50%);color:var(--muted2);font-size:16px;}
#route-toggle{background:var(--brand);border:none;border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:white;font-size:16px;cursor:pointer;flex-shrink:0;}

/* MODE PILLS */
.mode-row{display:flex;gap:6px;padding:4px 12px 10px;overflow-x:auto;}
.mode-row::-webkit-scrollbar{display:none;}
.mode-pill{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:var(--r-full);border:1.5px solid var(--border);background:var(--white);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all 0.15s;flex-shrink:0;}
.mode-pill.on{border-color:transparent;color:white;}
.mode-pill[data-mode="all"].on{background:var(--brand);}
.mode-pill[data-mode="brt"].on{background:#1557B0;}
.mode-pill[data-mode="danfo"].on{background:#F4511E;}
.mode-pill[data-mode="keke"].on{background:#0F9D58;}
.mode-pill[data-mode="okada"].on{background:#F9AB00;}
.mode-pill[data-mode="ferry"].on{background:#7B1FA2;}
.mode-pill[data-mode="walk"].on{background:#5F6368;}

/* AC DROPDOWN */
.ac-drop{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--white);border-radius:var(--r);box-shadow:var(--shadow-lg);z-index:999;overflow:hidden;display:none;}
.ac-item{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;transition:background 0.1s;border-bottom:1px solid var(--s1);}
.ac-item:last-child{border-bottom:none;}
.ac-item:active{background:var(--s1);}
.ac-ico{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;background:var(--s1);}
.ac-text .ac-name{font-size:13px;font-weight:600;color:var(--text);}
.ac-text .ac-type{font-size:11px;color:var(--muted2);}

/* ── GPS FAB ── */
#gps-fab{position:absolute;bottom:16px;right:12px;z-index:400;width:44px;height:44px;background:var(--white);border:none;border-radius:50%;box-shadow:var(--shadow-md);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:all 0.2s;}
#gps-fab:active{transform:scale(0.92);}
#gps-fab.live{background:var(--brand-lt);}

/* ── STATUS STRIP ── */
#status-strip{position:absolute;bottom:70px;left:12px;right:12px;z-index:400;background:var(--white);border-radius:var(--r-sm);padding:7px 12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);transition:all 0.3s;}
#status-strip.live{background:var(--green-lt);color:var(--green);}
#status-strip.err{background:var(--orange-lt);color:var(--orange);}
.ss-dot{width:7px;height:7px;border-radius:50%;background:var(--muted2);flex-shrink:0;}
#status-strip.live .ss-dot{background:var(--green);animation:pulse 2s infinite;}
#status-strip.err .ss-dot{background:var(--orange);}
@keyframes pulse{50%{opacity:0.3;}}

/* ── BOTTOM SHEET ── */
#sheet{background:var(--white);border-radius:20px 20px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,0.1);z-index:300;flex-shrink:0;display:flex;flex-direction:column;max-height:65vh;transition:max-height 0.3s cubic-bezier(0.4,0,0.2,1);}
#sheet.min{max-height:56px;overflow:hidden;}
.sh-handle{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;cursor:pointer;}
.sh-pill{width:32px;height:4px;background:var(--s2);border-radius:2px;margin:0 auto;}
.sh-row{display:flex;align-items:center;justify-content:space-between;margin-top:4px;}
.sh-title{font-size:15px;font-weight:700;}
.sh-arr{font-size:11px;color:var(--muted2);transition:transform 0.3s;}
#sheet.min .sh-arr{transform:rotate(180deg);}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);padding:0 16px;}
.tab{flex:1;padding:10px 0;font-size:12px;font-weight:600;color:var(--muted);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.15s;display:flex;align-items:center;justify-content:center;gap:5px;}
.tab.on{color:var(--brand);border-bottom-color:var(--brand);}

.tab-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.tab-body::-webkit-scrollbar{display:none;}

/* ── ROUTE PANEL ── */
#route-panel{display:none;position:absolute;top:0;left:0;right:0;bottom:0;background:var(--white);z-index:500;flex-direction:column;}
#route-panel.show{display:flex;}
.rp-header{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--white);}
.rp-back{width:36px;height:36px;background:var(--s1);border:none;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.rp-inputs{flex:1;display:flex;flex-direction:column;gap:6px;}
.rp-inp-row{display:flex;align-items:center;gap:8px;}
.rp-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.rp-dot.from{background:var(--green);}
.rp-dot.to{background:var(--red);}
.rp-inp{flex:1;background:var(--s1);border:none;border-radius:8px;padding:9px 11px;font-family:'Inter',sans-serif;font-size:13px;color:var(--text);outline:none;position:relative;}
.rp-inp::placeholder{color:var(--muted2);}
.rp-inp:focus{background:var(--brand-lt);}
.rp-swap{width:28px;height:28px;background:var(--s1);border:1px solid var(--border);border-radius:50%;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform 0.3s;}
.rp-swap:active{transform:rotate(180deg);}
.rp-inp-wrap{flex:1;position:relative;}

/* TRANSPORT SELECTOR */
.transport-bar{display:flex;gap:6px;padding:10px 14px;overflow-x:auto;border-bottom:1px solid var(--border);}
.transport-bar::-webkit-scrollbar{display:none;}
.t-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--white);cursor:pointer;flex-shrink:0;transition:all 0.15s;}
.t-btn.on{border-color:transparent;}
.t-btn[data-t="brt"].on{background:var(--brand-lt);border-color:var(--brand);}
.t-btn[data-t="danfo"].on{background:var(--orange-lt);border-color:var(--orange);}
.t-btn[data-t="keke"].on{background:var(--green-lt);border-color:var(--green);}
.t-btn[data-t="okada"].on{background:var(--yellow-lt);border-color:var(--yellow);}
.t-btn[data-t="ferry"].on{background:var(--purple-lt);border-color:var(--purple);}
.t-btn[data-t="walk"].on{background:var(--s1);border-color:var(--muted);}
.t-ico{font-size:20px;}
.t-lbl{font-size:10px;font-weight:600;color:var(--muted);}
.t-btn.on .t-lbl{font-weight:700;}
.t-btn[data-t="brt"].on .t-lbl{color:var(--brand);}
.t-btn[data-t="danfo"].on .t-lbl{color:var(--orange);}
.t-btn[data-t="keke"].on .t-lbl{color:var(--green);}
.t-btn[data-t="okada"].on .t-lbl{color:var(--yellow);}
.t-btn[data-t="ferry"].on .t-lbl{color:var(--purple);}
.t-btn[data-t="walk"].on .t-lbl{color:var(--muted);}

#go-btn{margin:12px 14px;background:var(--brand);border:none;border-radius:var(--r);padding:14px;color:white;font-family:'Inter',sans-serif;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 2px 8px rgba(26,115,232,0.3);transition:all 0.2s;}
#go-btn:active{transform:scale(0.98);}

/* RESULTS */
#result-wrap{flex:1;overflow-y:auto;padding:0 14px 20px;}
#result-wrap::-webkit-scrollbar{display:none;}

.result-summary{background:var(--brand-lt);border-radius:var(--r);padding:14px;margin-bottom:14px;margin-top:12px;}
.rs-route{font-size:13px;font-weight:700;color:var(--brand);margin-bottom:8px;}
.rs-chips{display:flex;gap:6px;flex-wrap:wrap;}
.rs-chip{font-size:11px;font-weight:600;padding:4px 10px;border-radius:var(--r-full);background:var(--white);color:var(--text);}

.step-list{display:flex;flex-direction:column;}
.step{display:flex;gap:12px;align-items:stretch;}
.step-left{display:flex;flex-direction:column;align-items:center;width:40px;flex-shrink:0;}
.step-bubble{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;border:2px solid transparent;}
.bubble-walk{background:var(--s1);border-color:var(--s2);}
.bubble-brt{background:var(--brand-lt);border-color:var(--brand);}
.bubble-danfo{background:var(--orange-lt);border-color:var(--orange);}
.bubble-keke{background:var(--green-lt);border-color:var(--green);}
.bubble-okada{background:var(--yellow-lt);border-color:var(--yellow);}
.bubble-ferry{background:var(--purple-lt);border-color:var(--purple);}
.bubble-transfer{background:var(--s1);border-color:var(--border);}
.bubble-warn{background:#FEF7E0;border-color:var(--yellow);}
.step-vline{width:2px;flex:1;min-height:10px;background:var(--border);margin:3px 0;}
.step-body{flex:1;padding-bottom:16px;}
.step-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:3px;}
.step-detail{font-size:12px;color:var(--muted);line-height:1.6;}
.step-detail b{color:var(--text);font-weight:600;}
.step-dist{display:inline-block;margin-top:6px;font-size:11px;font-weight:600;color:var(--muted);background:var(--s1);padding:3px 9px;border-radius:var(--r-full);}
.step-warn{display:inline-block;margin-top:6px;font-size:11px;font-weight:600;color:var(--orange);background:var(--orange-lt);padding:3px 9px;border-radius:var(--r-full);}
.unavail-badge{display:inline-block;font-size:11px;color:var(--red);background:#FCE8E6;padding:2px 8px;border-radius:var(--r-full);margin-left:4px;font-weight:600;}

/* ── NEARBY TAB ── */
.nb-wrap{padding:14px;}
.nb-empty{text-align:center;padding:24px;color:var(--muted2);font-size:13px;}
.nb-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r);background:var(--white);border:1px solid var(--border);margin-bottom:8px;cursor:pointer;transition:all 0.15s;}
.nb-item:active{background:var(--s1);}
.nb-ico{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.nb-info{flex:1;min-width:0;}
.nb-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nb-meta{font-size:11px;color:var(--muted2);margin-top:2px;}
.nb-dist{font-size:12px;font-weight:700;color:var(--brand);}

/* ── LINES TAB ── */
.lines-wrap{padding:14px;}
.lg-title{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted2);margin:14px 0 8px;}
.lg-title:first-child{margin-top:0;}
.line-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:var(--r-sm);background:var(--white);border:1px solid var(--border);margin-bottom:6px;cursor:pointer;transition:background 0.15s;}
.line-row:active{background:var(--s1);}
.line-color{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.line-info{flex:1;}
.line-name{font-size:13px;font-weight:600;}
.line-stops{font-size:11px;color:var(--muted2);margin-top:1px;}
.line-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:var(--r-full);}
.lb-BRT{background:var(--brand-lt);color:var(--brand);}
.lb-Danfo{background:var(--orange-lt);color:var(--orange);}

/* POPUP */
.leaflet-popup-content-wrapper{background:var(--white)!important;border-radius:var(--r)!important;box-shadow:var(--shadow-lg)!important;padding:0!important;border:1px solid var(--border)!important;}
.leaflet-popup-content{margin:0!important;}
.leaflet-popup-tip{background:var(--white)!important;}
.leaflet-popup-close-button{color:var(--muted)!important;font-size:18px!important;top:8px!important;right:10px!important;}
.pu{padding:14px 16px;}
.pu-name{font-size:14px;font-weight:700;margin-bottom:3px;}
.pu-type{font-size:11px;color:var(--muted2);margin-bottom:8px;}
.pu-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;}
.pu-tag{font-size:10px;padding:3px 8px;border-radius:var(--r-full);background:var(--brand-lt);color:var(--brand);font-weight:600;}
.pu-avail{font-size:11px;color:var(--green);font-weight:600;}
.pu-unavail{font-size:11px;color:var(--muted2);}

/* USER DOT */
.udot{width:16px;height:16px;background:var(--brand);border:3px solid white;border-radius:50%;box-shadow:0 0 0 4px rgba(26,115,232,0.2),0 2px 6px rgba(0,0,0,0.3);}
.uacc{border-radius:50%;background:rgba(26,115,232,0.1);border:1px solid rgba(26,115,232,0.2);}

/* ROUTE LINE POPUP */
.leaflet-control-zoom a{background:var(--white)!important;color:var(--text)!important;border:1px solid var(--border)!important;}

/* EMPTY */
.empty-state{text-align:center;padding:32px 16px;}
.es-ico{font-size:40px;margin-bottom:10px;}
.es-title{font-size:15px;font-weight:700;margin-bottom:6px;}
.es-sub{font-size:13px;color:var(--muted2);line-height:1.5;}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="sp-icon">🚌</div>
  <div class="sp-name">Waka<span>Lagos</span></div>
  <div class="sp-sub">NAVIGATE THE CITY</div>
  <div class="sp-bar"><div class="sp-fill" id="sp-fill"></div></div>
  <div class="sp-msg" id="sp-msg">Loading routes...</div>
</div>

<!-- APP -->
<div id="app">

  <!-- MAP AREA -->
  <div id="map-wrap">
    <div id="map"></div>

    <!-- SEARCH CARD -->
    <div id="search-card">
      <div class="sc-row1">
        <div class="sc-logo">Waka<span>Lagos</span></div>
        <div class="sc-input-wrap">
          <input id="main-search" type="text" placeholder="Search bus stops, areas..." autocomplete="off">
          <div class="ac-drop" id="ac-main"></div>
        </div>
        <button id="route-toggle" title="Plan route">↗</button>
      </div>
      <div class="mode-row">
        <div class="mode-pill on" data-mode="all">🗺 All</div>
        <div class="mode-pill" data-mode="brt">🚌 BRT</div>
        <div class="mode-pill" data-mode="danfo">🚐 Danfo</div>
        <div class="mode-pill" data-mode="keke">🛺 Keke</div>
        <div class="mode-pill" data-mode="okada">🏍 Okada</div>
        <div class="mode-pill" data-mode="ferry">⛵ Ferry</div>
        <div class="mode-pill" data-mode="walk">🚶 Walk</div>
      </div>
    </div>

    <!-- STATUS -->
    <div id="status-strip"><div class="ss-dot"></div><span id="ss-text">Tap 📍 to enable live tracking</span></div>

    <!-- GPS FAB -->
    <button id="gps-fab">📍</button>
  </div>

  <!-- BOTTOM SHEET -->
  <div id="sheet">
    <div class="sh-handle" id="sh-handle">
      <div class="sh-pill"></div>
      <div class="sh-row" style="width:100%;margin-top:6px;">
        <div class="sh-title" id="sh-title">Explore</div>
        <div class="sh-arr">▲</div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="nearby">📍 Nearby</button>
      <button class="tab" data-tab="lines">🚌 Lines</button>
    </div>
    <div class="tab-body">
      <div id="tab-nearby">
        <div class="nb-wrap">
          <div class="nb-empty" id="nb-empty">📍 Tap the location button to find stops near you</div>
          <div id="nb-list"></div>
        </div>
      </div>
      <div id="tab-lines" style="display:none;">
        <div class="lines-wrap" id="lines-wrap"></div>
      </div>
    </div>
  </div>

  <!-- ROUTE PANEL (full screen overlay) -->
  <div id="route-panel">
    <div class="rp-header">
      <button class="rp-back" id="rp-back">←</button>
      <div class="rp-inputs">
        <div class="rp-inp-row">
          <div class="rp-dot from"></div>
          <div class="rp-inp-wrap">
            <input class="rp-inp" id="from-inp" type="text" placeholder="Your location or a bus stop" autocomplete="off">
            <div class="ac-drop" id="ac-from"></div>
          </div>
        </div>
        <div class="rp-inp-row">
          <div class="rp-dot to"></div>
          <div class="rp-inp-wrap">
            <input class="rp-inp" id="to-inp" type="text" placeholder="Where are you going?" autocomplete="off">
            <div class="ac-drop" id="ac-to"></div>
          </div>
        </div>
      </div>
      <button class="rp-swap" id="rp-swap">⇅</button>
    </div>

    <!-- TRANSPORT SELECTOR -->
    <div class="transport-bar" id="transport-bar">
      <div class="t-btn on" data-t="brt"><div class="t-ico">🚌</div><div class="t-lbl">BRT</div></div>
      <div class="t-btn on" data-t="danfo"><div class="t-ico">🚐</div><div class="t-lbl">Danfo</div></div>
      <div class="t-btn on" data-t="keke"><div class="t-ico">🛺</div><div class="t-lbl">Keke</div></div>
      <div class="t-btn on" data-t="okada"><div class="t-ico">🏍</div><div class="t-lbl">Okada</div></div>
      <div class="t-btn" data-t="ferry"><div class="t-ico">⛵</div><div class="t-lbl">Ferry</div></div>
      <div class="t-btn on" data-t="walk"><div class="t-ico">🚶</div><div class="t-lbl">Walking</div></div>
    </div>

    <button id="go-btn">Get Directions</button>
    <div id="result-wrap"></div>
  </div>

</div>

<script>

function initApp(){
  // Use OpenStreetMap — most reliable on Chrome Android
  map = L.map('map',{center:[6.5244,3.3792],zoom:12,zoomControl:false,attributionControl:true});

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19,
    attribution:'© OpenStreetMap'
  }).addTo(map);

  L.control.zoom({position:'bottomright'}).addTo(map);

  plotStops();
  renderLines();
  bindEvents();
}

function bindEvents(){
  document.getElementById('gps-fab').addEventListener('click',locateUser);
  document.getElementById('route-toggle').addEventListener('click',openRoutePanel);
  document.getElementById('rp-back').addEventListener('click',closeRoutePanel);
  document.getElementById('rp-swap').addEventListener('click',swapInputs);
  document.getElementById('go-btn').addEventListener('click',doRoute);
  document.getElementById('sh-handle').addEventListener('click',toggleSheet);

  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>switchTab(t.dataset.tab)));
  document.querySelectorAll('.mode-pill').forEach(p=>p.addEventListener('click',()=>setMapMode(p.dataset.mode,p)));
  document.querySelectorAll('.t-btn').forEach(b=>b.addEventListener('click',()=>toggleTransport(b)));

  bindAC('main-search','ac-main',name=>{
    const s=STOPS[name]; map.setView([s.lat,s.lng],16); showPopup(name,s);
    document.getElementById('main-search').value='';
  });
  bindAC('from-inp','ac-from',name=>{ document.getElementById('from-inp').value=name; });
  bindAC('to-inp','ac-to',name=>{ document.getElementById('to-inp').value=name; });
}

// MAP STOPS
// ════════════════════════════════════════════════
function plotStops(){
  stopKeys.forEach(name=>{
    const s=STOPS[name];
    const isBRT=s.routes.some(r=>r.startsWith('BRT'));
    const isTerm=s.type.includes('Terminal');
    const sz=isTerm?14:9;
    const col=isBRT?'#1A73E8':'#F4511E';
    const glow=isBRT?'rgba(26,115,232,0.5)':'rgba(244,81,30,0.5)';
    const icon=L.divIcon({
      className:'',
      html:`<div style="width:${sz}px;height:${sz}px;background:${col};border:2.5px solid white;border-radius:50%;box-shadow:0 1px 4px ${glow},0 0 0 ${isTerm?3:1}px ${col}44;"></div>`,
      iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]
    });
    L.marker([s.lat,s.lng],{icon}).addTo(map).on('click',()=>showPopup(name,s));
  });
}

function showPopup(name,s){
  const avail=[];
  if(s.keke) avail.push('🛺 Keke');
  if(s.okada) avail.push('🏍 Okada');
  if(s.ferry) avail.push('⛵ Ferry');
  const unavail=[];
  if(!s.keke) unavail.push('Keke');
  if(!s.okada) unavail.push('Okada');

  const tags=s.routes.map(r=>ROUTES[r]?`<span class="pu-tag">${ROUTES[r].name}</span>`:'').join('');

  L.popup({maxWidth:260})
    .setLatLng([s.lat,s.lng])
    .setContent(`<div class="pu">
      <div class="pu-name">${name}</div>
      <div class="pu-type">${s.type}</div>
      <div class="pu-tags">${tags}</div>
      ${avail.length?`<div class="pu-avail">${avail.join(' · ')}</div>`:''}
      ${unavail.length?`<div class="pu-unavail">Not available: ${unavail.join(', ')}</div>`:''}
    </div>`)
    .openOn(map);
}

// ════════════════════════════════════════════════
// GPS
// ════════════════════════════════════════════════
function locateUser(){
  if(!navigator.geolocation){ setStatus('GPS not available on this device','err'); return; }
  const fab=document.getElementById('gps-fab');
  fab.textContent='⏳';
  setStatus('Acquiring location...','');

  if(watchId) navigator.geolocation.clearWatch(watchId);

  watchId=navigator.geolocation.watchPosition(pos=>{
    userLat=pos.coords.latitude; userLng=pos.coords.longitude;
    const acc=Math.round(pos.coords.accuracy);

    if(accCircle) map.removeLayer(accCircle);
    accCircle=L.circle([userLat,userLng],{radius:acc,color:'#1A73E8',fillColor:'#1A73E8',fillOpacity:0.1,weight:1,className:'uacc'}).addTo(map);

    if(!userMarker){
      const icon=L.divIcon({className:'',html:'<div class="udot"></div>',iconSize:[16,16],iconAnchor:[8,8]});
      userMarker=L.marker([userLat,userLng],{icon,zIndexOffset:1000}).addTo(map);
      map.setView([userLat,userLng],15);
    } else {
      userMarker.setLatLng([userLat,userLng]);
    }

    fab.textContent='📍';
    fab.classList.add('live');
    setStatus(`Live tracking · ±${acc}m`,'live');
    document.getElementById('from-inp').value='My Location';
    updateNearby();
  }, err=>{
    fab.textContent='📍';
    const m={1:'Location permission denied. Please enable in Chrome settings.',2:'GPS signal lost. Try again.',3:'Location request timed out.'};
    setStatus(m[err.code]||'Location error','err');
  },{enableHighAccuracy:true,maximumAge:3000,timeout:20000});
}

function setStatus(msg,cls){
  const el=document.getElementById('status-strip');
  document.getElementById('ss-text').textContent=msg;
  el.className = cls ? cls : '';
  if(!cls) el.removeAttribute('class');
}

// ════════════════════════════════════════════════
// NEARBY
// ════════════════════════════════════════════════
function updateNearby(){
  if(!userLat) return;
  const list=stopKeys.map(n=>({n,d:gdist(userLat,userLng,STOPS[n].lat,STOPS[n].lng)})).sort((a,b)=>a.d-b.d).slice(0,12);
  document.getElementById('nb-empty').style.display='none';
  document.getElementById('nb-list').innerHTML=list.map(({n,d})=>{
    const s=STOPS[n];
    const isBRT=s.routes.some(r=>r.startsWith('BRT'));
    const dStr=d<1?`${Math.round(d*1000)}m`:`${d.toFixed(1)}km`;
    const avail=[s.keke?'🛺':'',s.okada?'🏍':'',s.ferry?'⛵':''].filter(Boolean).join(' ');
    return `<div class="nb-item" onclick="focusStop('${n}')">
      <div class="nb-ico" style="background:${isBRT?'#E8F0FE':'#FCE8E6'}">${isBRT?'🚌':'🚐'}</div>
      <div class="nb-info">
        <div class="nb-name">${n}</div>
        <div class="nb-meta">${s.type}${avail?' · '+avail:''}</div>
      </div>
      <div class="nb-dist">${dStr}</div>
    </div>`;
  }).join('');
}

function focusStop(name){
  const s=STOPS[name]; map.setView([s.lat,s.lng],16); showPopup(name,s);
}

function openRoutePanel(){ document.getElementById('route-panel').classList.add('show'); }

  [f.value,t.value]=[t.value,f.value];

// ════════════════════════════════════════════════
// ROUTE ENGINE
// ════════════════════════════════════════════════
function doRoute(){
  const fv=document.getElementById('from-inp').value.trim();
  const tv=document.getElementById('to-inp').value.trim();
  if(!fv||!tv){ showErr('Please enter both origin and destination.'); return; }

  let fromStop,fromLat,fromLng,fromLabel;
  if((fv.toLowerCase()==='my location'||fv==='My Location')&&userLat){
    fromLat=userLat; fromLng=userLng; fromLabel='Your Location';
    fromStop=nearestStop(userLat,userLng);
  } else {
    fromStop=matchStop(fv);
    if(!fromStop){ showErr(`"${fv}" not found. Try a bus stop name.`); return; }
    fromLat=STOPS[fromStop].lat; fromLng=STOPS[fromStop].lng; fromLabel=fromStop;
  }

  const toStop=matchStop(tv);
  if(!toStop){ showErr(`"${tv}" not found. Try a bus stop name.`); return; }

  clearRouteLayers();

  const toData=STOPS[toStop];
  // Route line
  const line=L.polyline([[fromLat,fromLng],[toData.lat,toData.lng]],{color:'#1A73E8',weight:5,opacity:0.85,dashArray:'10,6'}).addTo(map);
  routeLayers.push(line);

  // Walk tracking line from user to first stop
  if(userLat&&fromStop){
    const fData=STOPS[fromStop];
    const wLine=L.polyline([[userLat,userLng],[fData.lat,fData.lng]],{color:'#0F9D58',weight:3,opacity:0.7,dashArray:'5,8'}).addTo(map);
    routeLayers.push(wLine);
  }

  map.fitBounds([[fromLat,fromLng],[toData.lat,toData.lng]],{padding:[80,80]});

  const result=buildRoute(fromStop,toStop,fromLat,fromLng);
  renderResult(fromLabel,toStop,result);
  document.getElementById('result-wrap').scrollTop=0;
}

function buildRoute(fromStop,toStop,fLat,fLng){
  const fData=STOPS[fromStop],tData=STOPS[toStop];
  if(!fData||!tData) return null;
  const totalDist=gdist(fLat,fLng,tData.lat,tData.lng);
  const steps=[];

  // Walk to stop
  if(userLat){
    const w=gdist(userLat,userLng,fData.lat,fData.lng);
    if(w>0.05){
      const step={type:'walk',icon:'🚶',cls:'bubble-walk',title:`Walk to ${fromStop}`,
        detail:`Head to the bus stop — approximately ${w<1?Math.round(w*1000)+'m':w.toFixed(1)+'km'} on foot`,
        dist:w<1?`${Math.round(w*1000)}m`:`${w.toFixed(1)}km`,walkDist:w};
      // If >1km, suggest keke/okada
      if(w>1){
        const canKeke=fData.keke; const canOkada=fData.okada;
        if(canKeke||canOkada) step.walkSuggest=`${canKeke?'🛺 Keke':''}${canKeke&&canOkada?' or ':''}${canOkada?'🏍 Okada':''} recommended for this distance`;
        else step.walkWarn='No Keke or Okada nearby — you may need to walk or find transport';
      }
      steps.push(step);
    }
  }

  // Check allowed transport modes
  const useBRT=selectedModes.has('brt');
  const useDanfo=selectedModes.has('danfo');

  // Find direct route
  const shared=fData.routes.filter(r=>{
    const rt=ROUTES[r]; if(!rt) return false;
    if(rt.type==='BRT'&&!useBRT) return false;
    if(rt.type==='Danfo'&&!useDanfo) return false;
    return tData.routes.includes(r);
  });

  if(shared.length){
    const r=ROUTES[shared[0]];
    const fi=r.stops.indexOf(fromStop),ti=r.stops.indexOf(toStop);
    const n=Math.abs(ti-fi);
    steps.push({
      type:r.type,icon:r.type==='BRT'?'🚌':'🚐',
      cls:r.type==='BRT'?'bubble-brt':'bubble-danfo',
      title:`${r.type==='BRT'?'BRT Bus':'Danfo'} — ${r.name}`,
      detail:`Board at <b>${fromStop}</b> → Alight at <b>${toStop}</b> · ${n} stop${n!==1?'s':''}`,
      dist:`${gdist(fData.lat,fData.lng,tData.lat,tData.lng).toFixed(1)}km`
    });
  } else {
    // Connect via hub
    let connected=false;
    outer: for(const fr of fData.routes){
      for(const tr of tData.routes){
        const rF=ROUTES[fr],rT=ROUTES[tr];
        if(!rF||!rT) continue;
        if(rF.type==='BRT'&&!useBRT) continue;
        if(rF.type==='Danfo'&&!useDanfo) continue;
        if(rT.type==='BRT'&&!useBRT) continue;
        if(rT.type==='Danfo'&&!useDanfo) continue;
        const common=rF.stops.filter(s=>rT.stops.includes(s)&&s!==fromStop&&s!==toStop);
        if(common.length){
          const via=common[0];
          const fi1=rF.stops.indexOf(fromStop),ti1=rF.stops.indexOf(via);
          const fi2=rT.stops.indexOf(via),ti2=rT.stops.indexOf(toStop);
          const d1=gdist(fData.lat,fData.lng,STOPS[via].lat,STOPS[via].lng);
          const d2=gdist(STOPS[via].lat,STOPS[via].lng,tData.lat,tData.lng);
          steps.push({type:rF.type,icon:rF.type==='BRT'?'🚌':'🚐',cls:rF.type==='BRT'?'bubble-brt':'bubble-danfo',
            title:`${rF.type} — ${rF.name}`,
            detail:`Board at <b>${fromStop}</b> → Alight at <b>${via}</b> · ${Math.abs(ti1-fi1)} stops`,dist:`${d1.toFixed(1)}km`});
          steps.push({type:'transfer',icon:'🔄',cls:'bubble-transfer',
            title:`Transfer at ${via}`,detail:`Exit and board ${rT.type} toward ${toStop}`,dist:'~5 min'});
          steps.push({type:rT.type,icon:rT.type==='BRT'?'🚌':'🚐',cls:rT.type==='BRT'?'bubble-brt':'bubble-danfo',
            title:`${rT.type} — ${rT.name}`,
            detail:`Board at <b>${via}</b> → Alight at <b>${toStop}</b> · ${Math.abs(ti2-fi2)} stops`,dist:`${d2.toFixed(1)}km`});
          connected=true; break outer;
        }
      }
    }
    if(!connected){
      const hub=bestHub(fData.lat,fData.lng);
      steps.push({type:'Danfo',icon:'🚐',cls:'bubble-danfo',title:`Danfo toward ${hub}`,
        detail:`Take any bus heading to ${hub} — a major transfer point`,dist:`${gdist(fData.lat,fData.lng,STOPS[hub].lat,STOPS[hub].lng).toFixed(1)}km`});
      steps.push({type:'transfer',icon:'🔄',cls:'bubble-transfer',title:`Connect at ${hub}`,
        detail:`Board a bus or BRT toward ${toStop}`,dist:'~10 min'});
      steps.push({type:'Danfo',icon:'🚐',cls:'bubble-danfo',title:`Continue to ${toStop}`,
        detail:`Ride to your destination`,dist:`${gdist(STOPS[hub].lat,STOPS[hub].lng,tData.lat,tData.lng).toFixed(1)}km`});
    }
  }

  // Last mile at destination
  if(tData.keke||tData.okada){
    const opts=[tData.keke?'🛺 Keke Napep':'',tData.okada?'🏍 Okada':''].filter(Boolean);
    steps.push({type:'lastmile',icon:tData.okada?'🏍':'🛺',cls:tData.okada?'bubble-okada':'bubble-keke',
      title:`Last-mile at ${toStop}`,detail:`${opts.join(' and ')} available near the bus stop`,dist:'nearby'});
  } else {
    steps.push({type:'unavail',icon:'ℹ️',cls:'bubble-warn',
      title:`No Keke or Okada at ${toStop}`,detail:`Keke and Okada are not available at this stop. You may need to walk to your final destination.`,dist:''});
  }

  const estMins=Math.round(totalDist*5+steps.filter(s=>s.type==='transfer').length*8+(userLat?gdist(userLat,userLng,fData.lat,fData.lng)*12:0)+8);

  return {steps,totalDist,estMins};
}

function renderResult(fromLabel,toStop,r){
  const el=document.getElementById('result-wrap');
  if(!r){ el.innerHTML=''; return; }
  const dStr=r.totalDist<1?`${Math.round(r.totalDist*1000)}m`:`${r.totalDist.toFixed(1)}km`;

  const stepsHTML=r.steps.map((s,i)=>{
    let extra='';
    if(s.walkDist>1&&s.walkSuggest) extra=`<div class="step-warn">💡 ${s.walkSuggest}</div>`;
    if(s.walkDist>1&&s.walkWarn) extra=`<div class="step-warn">⚠️ ${s.walkWarn}</div>`;
    const unavailBadge=s.type==='unavail'?'<span class="unavail-badge">Not available</span>':'';
    return `<div class="step">
      <div class="step-left">
        <div class="step-bubble ${s.cls}">${s.icon}</div>
        ${i<r.steps.length-1?'<div class="step-vline"></div>':''}
      </div>
      <div class="step-body">
        <div class="step-title">${s.title}${unavailBadge}</div>
        <div class="step-detail">${s.detail}</div>
        ${s.dist?`<span class="step-dist">${s.dist}</span>`:''}
        ${extra}
      </div>
    </div>`;
  }).join('');

  el.innerHTML=`
    <div class="result-summary">
      <div class="rs-route">${fromLabel} → ${toStop}</div>
      <div class="rs-chips">
        <span class="rs-chip">⏱ ~${r.estMins} min</span>
        <span class="rs-chip">📏 ${dStr}</span>
      </div>
    </div>
    <div class="step-list">${stepsHTML}</div>`;
}

function showErr(msg){
  document.getElementById('result-wrap').innerHTML=`
    <div class="empty-state"><div class="es-ico">🔍</div>
    <div class="es-title">Route not found</div>
    <div class="es-sub">${msg}</div></div>`;
}

function clearRouteLayers(){ routeLayers.forEach(l=>map.removeLayer(l)); routeLayers=[]; }

// ════════════════════════════════════════════════
// LINES
// ════════════════════════════════════════════════
function renderLines(){
  const brt=Object.entries(ROUTES).filter(([k])=>k.startsWith('BRT'));
  const danfo=Object.entries(ROUTES).filter(([k])=>k.startsWith('DANFO'));
  const w=document.getElementById('lines-wrap');
  const grp=(title,routes)=>`
    <div class="lg-title">${title}</div>
    ${routes.map(([k,r])=>`
      <div class="line-row" onclick="drawLine('${k}')">
        <div class="line-color" style="background:${r.color}"></div>
        <div class="line-info">
          <div class="line-name">${r.name}</div>
          <div class="line-stops">${r.stops.length} stops</div>
        </div>
        <span class="line-badge lb-${r.type}">${r.type}</span>
      </div>`).join('')}`;
  w.innerHTML=grp('🔵 BRT Routes',brt)+grp('🟠 Danfo Routes',danfo);
}

function drawLine(key){
  clearRouteLayers();
  const r=ROUTES[key]; if(!r) return;
  const coords=r.stops.map(s=>STOPS[s]?[STOPS[s].lat,STOPS[s].lng]:null).filter(Boolean);
  if(coords.length<2) return;
  const line=L.polyline(coords,{color:r.color,weight:5,opacity:0.9}).addTo(map);
  routeLayers.push(line);
  map.fitBounds(line.getBounds(),{padding:[40,40]});
}

// ════════════════════════════════════════════════
// AUTOCOMPLETE
// ════════════════════════════════════════════════
function bindAC(inputId,listId,onPick){
  const inp=document.getElementById(inputId);
  const list=document.getElementById(listId);
  inp.addEventListener('input',()=>{
    const q=inp.value.toLowerCase().trim();
    if(q.length<2){ list.style.display='none'; return; }
    const hits=stopKeys.filter(n=>n.toLowerCase().includes(q)).slice(0,7);
    if(!hits.length){ list.style.display='none'; return; }
    list.innerHTML=hits.map(n=>{
      const s=STOPS[n]; const isBRT=s.routes.some(r=>r.startsWith('BRT'));
      return `<div class="ac-item" onclick="pickAC('${inputId}','${listId}','${n}')">
        <div class="ac-ico" style="background:${isBRT?'#E8F0FE':'#FCE8E6'}">${isBRT?'🚌':'🚐'}</div>
        <div class="ac-text"><div class="ac-name">${n}</div><div class="ac-type">${s.type}</div></div>
      </div>`;
    }).join('');
    list.style.display='block';
    list._cb=onPick;
  });
  document.addEventListener('click',e=>{ if(!inp.contains(e.target)&&!list.contains(e.target)) list.style.display='none'; });
}

function pickAC(inputId,listId,name){
  document.getElementById(inputId).value=name;
  const list=document.getElementById(listId);
  list.style.display='none';
  if(list._cb) list._cb(name);
}

  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===tab));

// ════════════════════════════════════════════════
// UTILS
// ════════════════════════════════════════════════
function gdist(la1,lo1,la2,lo2){
  const R=6371,dLa=(la2-la1)*Math.PI/180,dLo=(lo2-lo1)*Math.PI/180;
  const a=Math.sin(dLa/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLo/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function nearestStop(lat,lng){ return stopKeys.reduce((b,n)=>gdist(lat,lng,STOPS[n].lat,STOPS[n].lng)<gdist(lat,lng,STOPS[b].lat,STOPS[b].lng)?n:b); }
function matchStop(q){
  const lq=q.toLowerCase().trim();
  return stopKeys.find(n=>n.toLowerCase()===lq)||stopKeys.find(n=>n.toLowerCase().includes(lq)||lq.includes(n.toLowerCase().split(' ')[0]))||null;
}
function bestHub(lat,lng){
  const hubs=['Oshodi','Mile 12','Ojota','Yaba','CMS','Berger','Mile 2','Iyana Ipaja','TBS','Ikeja'];
  return hubs.filter(h=>STOPS[h]).reduce((b,h)=>gdist(lat,lng,STOPS[h].lat,STOPS[h].lng)<gdist(lat,lng,STOPS[b].lat,STOPS[b].lng)?h:b,'Oshodi');
}
